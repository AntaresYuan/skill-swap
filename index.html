<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>技能换换 · AI 技能交换</title>
<meta name="description" content="用你会的，换你想学的。AI 顾问小换帮你建立技能档案、匹配交换伙伴、约课并提醒上课。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='a' cx='.3' cy='.3' r='.9'><stop offset='0' stop-color='%23fff' stop-opacity='.9'/><stop offset='.35' stop-color='%23b18cff'/><stop offset='.7' stop-color='%237c5cff'/><stop offset='1' stop-color='%23ff7ab6'/></radialGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23a)'/></svg>">
<style>
:root{
  --bg:#ffffff;--side:#f8f8f9;--panel:#ffffff;--text:#18181b;--text2:#3f3f46;--muted:#71717a;--faint:#a1a1aa;
  --line:#e7e7ea;--line2:#f0f0f2;--soft:#f4f4f5;--hover:#efeff1;
  --primary:#18181b;--on-primary:#ffffff;
  --accent:#6d5bf6;--accent-soft:#f3f1ff;--accent-line:#e2dcff;
  --teach:#0f9f6e;--teach-soft:#e9f7f1;--learn:#ea6a12;--learn-soft:#fff2e8;
  --gold:#f5a524;--red:#ef4444;--green:#22c55e;
  --brand:linear-gradient(135deg,#7c5cff 0%,#b65cff 50%,#ff7ab6 100%);
  --shadow-xs:0 1px 2px rgba(24,24,27,.05);
  --shadow-sm:0 1px 2px rgba(24,24,27,.04),0 2px 8px rgba(24,24,27,.05);
  --shadow-md:0 4px 12px rgba(24,24,27,.06),0 12px 32px rgba(24,24,27,.08);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f11;--side:#141416;--panel:#18181b;--text:#ededef;--text2:#d4d4d8;--muted:#a1a1aa;--faint:#71717a;
  --line:#27272a;--line2:#202023;--soft:#1f1f23;--hover:#232327;
  --primary:#fafafa;--on-primary:#18181b;
  --accent:#9d8cff;--accent-soft:#1e1a33;--accent-line:#352d5c;
  --teach:#34d399;--teach-soft:#10261e;--learn:#fb923c;--learn-soft:#2b1a0e;
  --shadow-xs:none;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.fill{fill:currentColor;stroke:none}

/* ---------- orb (小换) ---------- */
.orb{display:inline-block;flex:none;border-radius:50%;position:relative;background:
  radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 32%),
  conic-gradient(from 210deg,#7c5cff,#b65cff,#ff7ab6,#ffb36b,#7c5cff);box-shadow:inset 0 -2px 6px rgba(60,20,140,.25)}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 80%,rgba(124,92,255,.5),transparent 60%)}
.orb.spin{animation:orbspin 1.6s linear infinite}
@keyframes orbspin{to{transform:rotate(360deg)}}
.orb.breathe{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);filter:saturate(1.25) brightness(1.05)}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:272px 1fr;height:100vh;height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:650;font-size:16px;letter-spacing:.02em}
.brand small{font-weight:500;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:2px}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:0;background:none;color:var(--text2);font-size:14px;text-align:left;width:100%}
.nv:hover{background:var(--hover)}
.nv.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-xs);outline:1px solid var(--line)}
.nv .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nv .cnt.hot{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.sec-l{font-size:12px;color:var(--faint);padding:18px 20px 6px;font-weight:500}
.threads{flex:1;overflow-y:auto;padding:0 10px 10px}
.th{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.th:hover{background:var(--hover)}
.th.on{background:var(--panel);box-shadow:var(--shadow-xs);outline:1px solid var(--line)}
.th .bd{flex:1;min-width:0}
.th .nm{font-size:14px;font-weight:550;display:flex;justify-content:space-between;gap:6px}
.th .nm small{font-weight:400;font-size:11px;color:var(--faint);white-space:nowrap}
.th .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .ud{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.side-tip{margin:4px 10px;padding:12px 12px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--muted);line-height:1.6}
.acct{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.acct:hover{background:var(--hover)}
.acct .nm{font-size:14px;font-weight:550;line-height:1.3}
.acct .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.coin{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#ffd36b,#f5a524);color:#7a4a00;font-size:9px;font-weight:800;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.main{min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);position:relative}
.scrim{display:none}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;flex:none;line-height:1;letter-spacing:0}
.vf{color:#3b82f6;display:inline-flex}
.vf svg{width:15px;height:15px}

/* ---------- chat ---------- */
.head{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(12px);position:relative;z-index:2}
.head .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;line-height:1.3}
.head .s{font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.menu{display:none;border:0;background:none;padding:6px;margin-left:-6px;border-radius:8px;color:var(--text)}
.menu:hover{background:var(--hover)}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 11px;font-size:13px;font-weight:550;white-space:nowrap;box-shadow:var(--shadow-xs)}
.hbtn:hover{background:var(--hover)}
.hbtn .spark{color:var(--accent)}
.msgs{flex:1;overflow-y:auto;scroll-behavior:smooth}
.stream-col{max-width:760px;margin:0 auto;padding:28px 24px 12px;display:flex;flex-direction:column;gap:22px}
.hero{text-align:center;padding:26px 0 6px}
.hero .orb{width:56px;height:56px}
.hero h1{font-size:26px;font-weight:650;letter-spacing:.02em;margin:18px 0 6px}
.hero p{color:var(--muted);margin:0 auto;max-width:460px;font-size:14.5px}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.pills span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}
.pills svg{width:14px;height:14px;color:var(--accent)}
.m{display:flex;gap:12px;align-items:flex-start;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.me{justify-content:flex-end}
.m .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.m.ai .orb{width:26px;height:26px;margin-top:1px}
.ai-text{font-size:15px;line-height:1.75;color:var(--text);max-width:100%;word-break:break-word}
.ai-text b{font-weight:620}
.ai-text a{color:var(--accent);text-decoration:none;word-break:break-all}
.stream.typing{white-space:pre-wrap}
.stream.typing::after{content:'';display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--text);animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.bubble{padding:9px 15px;border-radius:18px;max-width:min(560px,82%);word-break:break-word;font-size:15px;line-height:1.6}
.m.me .bubble{background:var(--soft);border-bottom-right-radius:6px}
.m.peer .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow-xs)}
.m.peer .av{margin-top:2px}
.ai-in{display:flex;flex-direction:column;gap:6px;max-width:100%}
.ai-in .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ai-in .lab b{font-weight:600;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.ai-in .box{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:10px 14px;font-size:14.5px;line-height:1.7}
.sys{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.sys::before,.sys::after{content:'';flex:1;height:1px;background:var(--line)}
.thinking{display:flex;align-items:center;gap:10px;height:26px}
.shimmer{font-size:14px;font-weight:500;background:linear-gradient(90deg,var(--faint) 0%,var(--faint) 40%,var(--text) 50%,var(--faint) 60%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.dots{display:inline-flex;gap:4px;padding:6px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.dock{flex:none;padding:0 24px 10px;background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.dock-in{max-width:760px;margin:0 auto}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.suggest:empty{display:none}
.suggest button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow-xs);transition:.15s}
.suggest button:hover{border-color:var(--faint);color:var(--text)}
.suggest button svg{width:13px;height:13px;color:var(--faint)}
.composer{border:1px solid var(--line);background:var(--panel);border-radius:22px;box-shadow:var(--shadow-md);padding:12px 12px 10px 18px;transition:border-color .15s}
.composer:focus-within{border-color:var(--faint)}
.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;max-height:160px;min-height:26px;line-height:1.6;font-size:15px;padding:2px 0}
.composer textarea::placeholder{color:var(--faint)}
.c-row{display:flex;align-items:center;gap:4px;margin-top:8px}
.ib{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.ib:hover{background:var(--hover);color:var(--text)}
.c-row .grow{flex:1}
.c-hint{font-size:12px;color:var(--faint);margin-right:8px}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;transition:.15s}
.send:disabled{background:var(--line);color:var(--faint);cursor:default}
.send svg{width:17px;height:17px;stroke-width:2.2}
.disclaim{text-align:center;font-size:11.5px;color:var(--faint);padding:8px 0 2px}

/* ---------- A2UI ---------- */
.a2ui{width:100%;max-width:620px;transition:opacity .35s,transform .35s}
.a2ui.pre{opacity:0;transform:translateY(6px)}
.a2ui:has(.a2-list){max-width:760px}
.a2-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);min-width:0}
.a2-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.a2-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.a2-row.between{justify-content:space-between;flex-wrap:nowrap}
.a2-row .a2-row{flex-wrap:nowrap}
.a2-row>.a2-col{gap:2px}
.a2-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.a2-list.v{grid-template-columns:1fr}
.a2-list>.a2-card{display:flex;flex-direction:column;padding:0;overflow:hidden}
.a2-list>.a2-card>.a2-col{flex:1;padding:0 18px 18px;gap:12px}
.a2-list>.a2-card>.a2-col>.a2-btn:last-child{margin-top:auto}
.a2-hr{border:0;border-top:1px solid var(--line2);margin:2px 0;width:100%}
.t-h3{font-size:18px;font-weight:650;line-height:1.35}
.t-h4{font-size:16px;font-weight:650;line-height:1.4}
.t-h5{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--text)}
.t-caption{font-size:13px;color:var(--muted);line-height:1.6}
.t-body{font-size:14px;line-height:1.65;color:var(--text2)}
.t-body b,.t-caption b{color:var(--text);font-weight:600}
.lbl{font-size:12px;color:var(--faint);min-width:52px}
.a2-chips{display:flex;flex-wrap:wrap;gap:8px}
.a2-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:999px;padding:6px 14px;font-size:13.5px;transition:.12s;box-shadow:var(--shadow-xs)}
.a2-chip:hover{border-color:var(--faint);color:var(--text)}
.a2-chip svg{width:14px;height:14px;stroke-width:2.4;display:none}
.a2-chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.a2-chip.on svg{display:inline}
.a2-field{display:grid;gap:6px;width:100%}
.a2-field>span{font-size:13px;color:var(--muted)}
.a2-input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);outline:0;width:100%;transition:.12s}
.a2-input::placeholder{color:var(--faint)}
.a2-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.a2-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 16px;font-weight:560;font-size:14px;transition:.12s;box-shadow:var(--shadow-xs)}
.a2-btn:hover{background:var(--hover)}
.a2-btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.a2-btn.pri:hover{opacity:.88}
.a2-btn svg{width:16px;height:16px}
.a2-list .a2-btn{width:100%}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:13px;background:var(--soft);color:var(--text);white-space:nowrap;font-weight:500}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.tag em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.tag.teach{background:var(--teach-soft)}.tag.teach i{background:var(--teach)}
.tag.learn{background:var(--learn-soft)}.tag.learn i{background:var(--learn)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;align-self:flex-start;background:var(--panel)}
.badge svg{width:13px;height:13px}
.badge.pri{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.teach{border-color:transparent;background:var(--teach-soft);color:var(--teach);font-weight:600}
.badge.learn{border-color:transparent;background:var(--learn-soft);color:var(--learn);font-weight:600}
.meta{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);line-height:1.5;min-width:0}
.meta svg{width:15px;height:15px;color:var(--muted);margin-top:2px}
.meta span{min-width:0;word-break:break-all}
.meta a{color:var(--accent);text-decoration:none}
.a2-rating{display:flex;gap:2px}
.a2-rating button{border:0;background:none;padding:2px;color:var(--line)}
.a2-rating button svg{width:28px;height:28px}
.a2-rating button.on{color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--faint)}
.step .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line)}
.step.done{color:var(--text2)}
.step.done .ic{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.step.done .ic svg{width:12px;height:12px;stroke-width:3}
.step.run{color:var(--text)}
.step.run .ic{border-color:var(--accent);border-top-color:transparent;animation:orbspin .8s linear infinite}
.step small{color:var(--faint);margin-left:auto;font-size:12px}
.pcard-h{margin:0 -18px}
.pcard-cover{height:64px;position:relative}
.pcard-top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px;margin-top:-29px;position:relative;z-index:1}
.pcard-top .av{border:3px solid var(--panel);box-shadow:var(--shadow-sm)}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding-bottom:2px}
.score b{font-size:20px;font-weight:700;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{font-size:11px;color:var(--muted)}
.pcard-name{padding:10px 18px 0}
.pcard-name .n{font-weight:650;font-size:16px;display:flex;align-items:center;gap:5px}
.pcard-name .s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard-name .s svg{width:12px;height:12px;color:var(--gold)}
.a2ui.locked .a2-chip,.a2ui.locked .a2-input,.a2ui.locked .a2-rating{pointer-events:none}
.a2ui.locked .a2-chip:not(.on){opacity:.4}
.a2ui.locked .a2-btn:not(.chosen){display:none}
.a2ui.locked .a2-btn.chosen{pointer-events:none;background:var(--soft);border-color:var(--line);color:var(--muted);box-shadow:none}

/* ---------- pages ---------- */
.page{flex:1;overflow-y:auto}
.page-in{max-width:880px;margin:0 auto;padding:32px 28px 48px}
.page h1{font-size:24px;font-weight:650;margin:0 0 4px;letter-spacing:.02em}
.page .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px;scrollbar-width:none}
.day{flex:none;width:54px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 0 9px;text-align:center;position:relative;color:var(--text)}
.day small{display:block;font-size:11px;color:var(--muted);line-height:1.4}
.day b{font-size:17px;font-weight:600}
.day:hover{background:var(--hover)}
.day.today small{color:var(--accent);font-weight:600}
.day.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.day.on small{color:inherit;opacity:.75}
.day i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.sech{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.ev{display:grid;grid-template-columns:76px 1fr;gap:18px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);margin-bottom:12px;position:relative;overflow:hidden}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ev.done::before{background:var(--teach)}
.ev .tm b{font-size:20px;display:block;line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums}
.ev .tm small{font-size:12px;color:var(--muted);display:block}
.ev .ti{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ev .metas{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.ev .acts{display:flex;gap:8px;flex-wrap:wrap}
.st{font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st.up{background:var(--accent-soft);color:var(--accent)}
.st.live{background:#fee2e2;color:#dc2626}
.st.done{background:var(--teach-soft);color:var(--teach)}
@media (prefers-color-scheme:dark){.st.live{background:#3a1515;color:#f87171}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:550;white-space:nowrap;color:var(--text);box-shadow:var(--shadow-xs)}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;font-size:14px}
.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--muted)}
.empty .ei svg{width:22px;height:22px}
.empty h3{color:var(--text);font-size:16px;margin:0 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}
.card .pad{padding:20px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.kv{font-size:12.5px;color:var(--faint);margin:14px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:12px;padding:12px 14px}
.stat b{font-size:22px;display:block;line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ledger div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-top:1px solid var(--line2);color:var(--text2)}
.plus{color:var(--teach);font-weight:600}.minus{color:var(--learn);font-weight:600}.zero{color:var(--faint)}
.rules{font-size:12.5px;color:var(--muted);display:grid;gap:4px;margin-bottom:14px;padding:12px 14px;background:var(--soft);border-radius:12px}
.topbar{display:none}

/* ---------- notification / toast ---------- */
.notif{position:fixed;top:16px;right:16px;z-index:70;width:min(380px,calc(100vw - 24px));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md);padding:14px;display:flex;gap:12px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.1)}
.notif.show{transform:none;opacity:1;pointer-events:auto}
.notif .orb{width:34px;height:34px}
.notif .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.5}
.notif .tx b{display:block;font-size:14px}
.notif .tx span{color:var(--muted)}
.notif .acts{display:flex;gap:8px;margin-top:10px}
.notif .x{border:0;background:none;color:var(--faint);height:24px;width:24px;display:grid;place-items:center;border-radius:6px}
.notif .x:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(12px);background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:calc(100vw - 32px);box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- classroom ---------- */
.room{position:fixed;inset:0;z-index:60;background:#0b0b0d;color:#f4f4f5;display:none;flex-direction:column}
.room.show{display:flex}
.room-top{display:flex;align-items:center;gap:14px;padding:14px 22px;flex-wrap:wrap}
.room-top .ttl{font-weight:600;font-size:15px}
.room-top .ttl small{display:block;font-weight:400;color:#a1a1aa;font-size:12px}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#fca5a5;background:rgba(239,68,68,.12);padding:3px 10px;border-radius:999px}
.rec::before{content:'';width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink 1.4s infinite}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.07);padding:5px 12px;border-radius:999px;font-size:13px}
.room-body{flex:1;display:grid;grid-template-columns:1fr 340px;gap:14px;padding:0 14px;min-height:0}
.stage{position:relative;display:flex;min-height:0}
.tile{flex:1;border-radius:20px;background:radial-gradient(120% 90% at 50% 30%,#26262c,#121215);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.tile .nm{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:4px 10px;border-radius:8px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.tile .nm svg{width:13px;height:13px}
.talk{border-radius:50%;padding:5px;animation:talk 1.8s infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 0 rgba(157,140,255,0)}50%{box-shadow:0 0 0 12px rgba(157,140,255,.22)}}
.tile.me{position:absolute;right:18px;bottom:18px;width:200px;height:128px;flex:none;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tile.me.off{background:#18181b}
.tile.me.off .av{opacity:.25}
.caption{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:7px 14px;border-radius:10px;font-size:14px;max-width:62%;text-align:center}
.offline-card{text-align:center;max-width:380px;padding:0 20px}
.offline-card .pin{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin:0 auto 14px}
.offline-card .pin svg{width:24px;height:24px}
.notes{border-radius:20px;background:#141417;border:1px solid rgba(255,255,255,.06);padding:18px;overflow-y:auto}
.notes h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.notes .orb{width:20px;height:20px}
.notes .nsub{font-size:12px;color:#a1a1aa;margin:4px 0 14px}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;animation:rise .3s;line-height:1.55}
.note small{display:block;color:#71717a;font-size:11px}
.room-ctl{display:flex;justify-content:center;gap:12px;padding:16px}
.rbtn{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.rbtn:hover{background:rgba(255,255,255,.16)}
.rbtn.off{background:#fff;color:#18181b}
.rbtn.end{background:#ef4444;width:auto;padding:0 22px;border-radius:999px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.rbtn.end:hover{background:#dc2626}

/* ---------- A2UI inspector (?a2ui) ---------- */
.insp{position:fixed;right:0;top:0;bottom:0;width:420px;background:#0b0b0d;color:#d4d4d8;z-index:90;display:none;flex-direction:column;font:12px/1.45 ui-monospace,Menlo,monospace;border-left:1px solid #27272a}
.insp.show{display:flex}
.insp h4{margin:0;padding:10px 12px;border-bottom:1px solid #27272a;font:600 13px -apple-system,sans-serif;color:#fff;display:flex;justify-content:space-between}
.insp .lg{flex:1;overflow:auto;padding:8px 12px}
.insp pre{margin:0 0 10px;white-space:pre-wrap;word-break:break-all;border-left:3px solid #7c5cff;padding-left:8px}
.insp pre.up{border-color:#34d399}

/* ---------- responsive ---------- */
@media (max-width:900px){.room-body{grid-template-columns:1fr 280px}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:284px;z-index:50;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-md)}

  .dock{padding:0 12px 8px}

  .hero h1{font-size:22px}

  .page-in{padding:20px 16px 36px}
  .grid2{grid-template-columns:1fr}
  .ev{grid-template-columns:58px 1fr;gap:12px;padding:16px}
  .room-body{grid-template-columns:1fr;grid-template-rows:1fr 180px;padding:0 10px}
  .tile.me{width:112px;height:80px;right:12px;bottom:12px}
  .caption{max-width:86%;font-size:13px;bottom:104px}
  .insp{width:100%}
  .c-hint{display:none}
}

/* =====================================================================
   A2UI —— Agent 用 JSON 消息描述界面，客户端渲染，用户操作以 userAction 回传
   消息：surfaceUpdate / dataModelUpdate / beginRendering / deleteSurface
   客户端扩展目录：Avatar / Tag / Badge / Rating / Meta / ProfileHeader / Steps
   ===================================================================== */
const A2UI_LOG = [];
function a2uiLog(dir, msg){
  A2UI_LOG.push({dir,msg});
  const box=$('#insplog');
  if(box && $('#insp').classList.contains('show')){ box.insertAdjacentHTML('beforeend',`<pre class="${dir==='up'?'up':''}">${dir==='up'?'⬆ client → agent':'⬇ agent → client'}\n${esc(JSON.stringify(msg,null,1))}</pre>`); box.scrollTop=box.scrollHeight; }
}
function getPath(o,p){ return String(p).split('/').filter(Boolean).reduce((a,k)=>a==null?undefined:a[k], o); }
function setPath(o,p,v){ const ks=String(p).split('/').filter(Boolean); if(!ks.length){ Object.assign(o,v); return; } let c=o; ks.slice(0,-1).forEach(k=>{ if(c[k]==null||typeof c[k]!=='object') c[k]={}; c=c[k]; }); c[ks[ks.length-1]]=v; }
function toContents(o){ return Object.entries(o).map(([key,v])=> Array.isArray(v)?{key,valueList:v.map(x=>({valueString:String(x)}))} : typeof v==='number'?{key,valueNumber:v} : typeof v==='boolean'?{key,valueBoolean:v} : (v&&typeof v==='object')?{key,valueMap:toContents(v)} : {key,valueString:String(v??'')}); }
function fromVal(e){ if('valueString' in e) return e.valueString; if('valueNumber' in e) return e.valueNumber; if('valueBoolean' in e) return e.valueBoolean; if('valueMap' in e) return fromContents(e.valueMap); if('valueList' in e) return e.valueList.map(fromVal); }
function fromContents(c){ const o={}; (c||[]).forEach(e=>o[e.key]=fromVal(e)); return o; }
function a2uiReceive(msg){
  a2uiLog('down', msg);
  if(msg.surfaceUpdate){ const {surfaceId,components}=msg.surfaceUpdate; const s=state.surfaces[surfaceId]||(state.surfaces[surfaceId]={components:{},data:{},root:null,locked:false,chosen:null}); components.forEach(c=>s.components[c.id]=c.component); }
  else if(msg.dataModelUpdate){ const {surfaceId,path,contents}=msg.dataModelUpdate; const s=state.surfaces[surfaceId]; if(s){ setPath(s.data, path||'/', fromContents(contents)); save(); refreshSurface(surfaceId); } }
  else if(msg.beginRendering){ const s=state.surfaces[msg.beginRendering.surfaceId]; if(s) s.root=msg.beginRendering.root; }
  else if(msg.deleteSurface){ delete state.surfaces[msg.deleteSurface.surfaceId]; }
}
let B = null;
function comp(type, props){ const id='c'+(++B.n); B.list.push({id, component:{[type]:props}}); return id; }
const L = s => ({literalString:String(s)});
const kids = a => ({explicitList:a.filter(Boolean)});
const UI = {
  text:(t,hint='body')=>comp('Text',{text:L(t),usageHint:hint}),
  label:t=>comp('Text',{text:L(t),usageHint:'label'}),
  row:(a,o={})=>comp('Row',{children:kids(a),alignment:'center',distribution:o.between?'spaceBetween':'start'}),
  col:a=>comp('Column',{children:kids(a)}),
  list:(a,dir='horizontal')=>comp('List',{children:kids(a),direction:dir}),
  card:child=>comp('Card',{child}),
  divider:()=>comp('Divider',{}),
  button:(label,name,ctx={},primary=false,icon)=>comp('Button',{child:UI.text(label),primary,...(icon?{icon}:{}),action:{name,context:Object.entries(ctx).map(([key,v])=>({key,value:L(v)}))}}),
  choice:(path,opts,max=1)=>comp('MultipleChoice',{selections:{path},options:opts.map(o=>({label:L(o.label??o),value:String(o.value??o)})),maxAllowedSelections:max}),
  field:(label,path,ph='')=>comp('TextField',{label:L(label),text:{path},textFieldType:'shortText',placeholder:ph}),
  avatar:(u,size=40)=>comp('Avatar',{name:L(u.name),seed:L(u.id),size}),
  tag:(t,tone,level)=>comp('Tag',{text:L(t),tone,...(level?{level:L(level)}:{})}),
  badge:(t,tone='',icon)=>comp('Badge',{text:L(t),tone,...(icon?{icon}:{})}),
  meta:(icon,t)=>comp('Meta',{icon,text:L(t)}),
  rating:path=>comp('Rating',{value:{path},max:5}),
  profile:(u,score)=>comp('ProfileHeader',{userId:L(u.id),score}),
  steps:(items,path)=>comp('Steps',{items:items.map(L),done:{path}})
};
function buildSurface(fn, data={}){
  B={n:0,list:[]}; const root=fn(UI); const list=B.list; B=null;
  const sid='sf'+(++state.seq)+'_'+Math.random().toString(36).slice(2,6);
  [{surfaceUpdate:{surfaceId:sid,components:list}},{dataModelUpdate:{surfaceId:sid,path:'/',contents:toContents(data)}},{beginRendering:{surfaceId:sid,root}}].forEach(a2uiReceive);
  return sid;
}
function bval(s,v){ if(v==null) return ''; if('literalString' in v) return v.literalString; if('literalNumber' in v) return v.literalNumber; if('literalBoolean' in v) return v.literalBoolean; if('path' in v) return getPath(s.data,v.path); return ''; }
function surfHTML(sid){ const s=state.surfaces[sid]; if(!s||!s.root) return ''; return `<div class="a2ui${s.locked?' locked':''}" data-sid="${sid}">${compHTML(s,s.root)}</div>`; }
function compHTML(s,id){
  const c=s.components[id]; if(!c) return '';
  const [type,p]=Object.entries(c)[0];
  const ch=()=>(p.children&&p.children.explicitList||[]).map(k=>compHTML(s,k)).join('');
  switch(type){
    case 'Text': return p.usageHint==='label'?`<span class="lbl">${esc(bval(s,p.text))}</span>`:`<div class="t-${p.usageHint||'body'}">${md(bval(s,p.text))}</div>`;
    case 'Row': return `<div class="a2-row${p.distribution==='spaceBetween'?' between':''}">${ch()}</div>`;
    case 'Column': return `<div class="a2-col">${ch()}</div>`;
    case 'List': return `<div class="a2-list${p.direction==='vertical'?' v':''}">${ch()}</div>`;
    case 'Card': return `<div class="a2-card">${compHTML(s,p.child)}</div>`;
    case 'Divider': return '<hr class="a2-hr">';
    case 'Button': { const t=s.components[p.child]; const label=t&&t.Text?bval(s,t.Text.text):''; const chosen=s.chosen===id; return `<button class="a2-btn${p.primary?' pri':''}${chosen?' chosen':''}" data-a2btn="${id}">${chosen?I('check'):(p.icon?I(p.icon):'')}${esc(label)}${p.primary&&!chosen&&!p.icon?I('right'):''}</button>`; }
    case 'MultipleChoice': { const sel=getPath(s.data,p.selections.path)||[]; return `<div class="a2-chips" data-a2mc="${id}">${p.options.map(o=>`<button class="a2-chip${sel.includes(o.value)?' on':''}" data-v="${esc(o.value)}">${I('check')}${esc(bval(s,o.label))}</button>`).join('')}</div>`; }
    case 'TextField': return `<label class="a2-field">${p.label&&bval(s,p.label)?`<span>${esc(bval(s,p.label))}</span>`:''}<input class="a2-input" data-a2bind="${esc(p.text.path)}" value="${esc(getPath(s.data,p.text.path)??'')}" placeholder="${esc(p.placeholder||'')}"></label>`;
    case 'Avatar': return avatarHTML({id:bval(s,p.seed),name:bval(s,p.name)},p.size||40);
    case 'Tag': return tagHTML(bval(s,p.text),p.tone,p.level?bval(s,p.level):'');
    case 'Badge': return `<span class="badge ${p.tone||''}">${p.icon?I(p.icon):''}${esc(bval(s,p.text))}</span>`;

const norm = s => String(s).toLowerCase().replace(/\s+/g,'');
function skillMatch(a,b){ a=norm(a); b=norm(b); return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a)); }
const tRank = l => TEACH_LV.indexOf(l)+1;
const lRank = l => Math.max(0,LEARN_LV.indexOf(l));
function commonModes(u,P){ let m=P.mode==='都可以'?u.modes.slice():u.modes.filter(x=>x===P.mode); if(u.city!==P.city) m=m.filter(x=>x!=='线下'); return m; }
function matchInfo(u,P=state.profile){
  const theyTeach=[], iTeach=[];
  u.teach.forEach(t=>P.learn.forEach(l=>{ if(skillMatch(t.skill,l.skill)&&tRank(t.level)>lRank(l.level)&&!theyTeach.some(x=>x.skill===t.skill)) theyTeach.push({skill:t.skill,level:t.level,myLevel:l.level}); }));
  P.teach.forEach(t=>u.learn.forEach(l=>{ if(skillMatch(t.skill,l.skill)&&tRank(t.level)>lRank(l.level)&&!iTeach.some(x=>x.skill===t.skill)) iTeach.push({skill:t.skill,level:t.level,theirLevel:l.level}); }));
  const type=theyTeach.length&&iTeach.length?'both':theyTeach.length?'learn':iTeach.length?'teach':'none';
  if(type==='none') return {type};
  const avail=u.avail.filter(a=>P.avail.includes(a)); const modes=commonModes(u,P);
  let score={both:58,learn:38,teach:30}[type];
  score+=avail.length?6:0; score+=modes.length?5:-15; score+=(modes.includes('线下')?6:0);
  score+=Math.round((u.rating-4)*15)+(u.verified?3:0)+(theyTeach[0]&&tRank(theyTeach[0].level)>=3?2:0);
  score=Math.max(12,Math.min(99,score));
  const t=theyTeach[0], i=iTeach[0];
  let reason = type==='both' ? `${t.level}${t.skill}，又正好想学你的${i.skill}，可以直接互换，谁都不用花时间币。`
    : type==='learn' ? `${t.level}${t.skill}。${u.style.replace(/^我/,'TA ')}`
    : `正想学${i.skill}（现在${i.theirLevel}），你来教每课时赚 1 时间币，攒着去学${P.learn[0]?P.learn[0].skill:'想学的技能'}。`;
  if(avail.length) reason+=`你们都在${avail.join('、')}有空`+(modes.includes('线下')?`，还都在${u.city}，可以线下见面。`:'。');
  return {type,theyTeach,iTeach,score,reason,avail,modes};
}

const queues = {};
function enqueue(tid,fn){ queues[tid]=(queues[tid]||Promise.resolve()).then(fn).catch(e=>console.error(e)); return queues[tid]; }
async function showTyping(tid,from,ms,label){
  typingNow[tid]={from,label}; if(visible(tid)) renderTyping(tid); renderSide();

  delete typingNow[tid]; const t=$('#typing'); if(t&&visible(tid)) t.remove(); renderSide();

const typeMs = t => Math.min(1100, 380 + String(t||'').length*8);
async function reveal(tid,m){
  if(m.from!=='agent' || !visible(tid)) return;
  const el=document.querySelector(`[data-mid="${m.id}"]`); if(!el) return;
  const tx=el.querySelector('.stream'), sf=el.querySelector('.a2ui');
  if(sf) sf.classList.add('pre');
  if(tx && m.text){
    const full=tx.innerHTML, plain=m.text.replace(/\*\*/g,'');
    tx.classList.add('typing'); tx.textContent='';
    const step=Math.max(1,Math.ceil(plain.length/36));
    for(let i=0;i<plain.length;i+=step){ tx.textContent=plain.slice(0,i+step); if((i/step)%5===0) scrollDown(); await sleep(16); }
    tx.classList.remove('typing'); tx.innerHTML=full;
  }
  if(sf){ await sleep(40); sf.classList.remove('pre'); }
  scrollDown();
}

function parseSkills(text){
  let t=' '+String(text||'').toLowerCase()+' '; const found=[];
  const pairs=[]; Object.entries(ALIASES).forEach(([k,arr])=>arr.forEach(a=>pairs.push([k,a])));
  pairs.sort((a,b)=>b[1].length-a[1].length);
  pairs.forEach(([k,a])=>{ const re=/^[a-z]+$/.test(a)?new RegExp('(^|[^a-z])'+a+'([^a-z]|$)'):null; if(re?re.test(t):t.includes(a)){ if(!found.includes(k)) found.push(k); t=t.split(a).join(' '); } });
  if(!found.length){
    String(text||'').replace(/我(会|能|可以)?(教|学)?|想学|擅长|还有|以及|一些|吧|呢|啊|的/g,' ').split(/[,，、。;；\s和及跟与]+/).map(x=>x.trim()).filter(x=>x.length>=2&&x.length<=10).forEach(x=>found.push(x));
  }
  return uniq(found);
}

const SLOT_DEF = {'工作日白天':[[1,2,3,4,5],14],'工作日晚上':[[1,2,3,4,5],20],'周末上午':[[6,0],10],'周末下午':[[6,0],15],'周末晚上':[[6,0],19]};
function slotFromAvail(a,after=Date.now()){
  const [days,h]=SLOT_DEF[a]||SLOT_DEF['周末下午'];
  for(let i=0;i<15;i++){ const c=new Date(after); c.setDate(c.getDate()+i); c.setHours(h,0,0,0); if(days.includes(c.getDay())&&c.getTime()>after+2*HOUR) return c.getTime(); }
  return after+DAY;
}

  const ev=state.events.find(e=>e.id===eid); if(!ev) return;
  if(ev.status==='done'){ toast('这节课已经结束了'); return; }
  $('#notif').classList.remove('show');
  const u=userById(ev.uid), P=state.profile;
  ROOM.ev=ev; ROOM.t0=Date.now(); ROOM.mic=true; ROOM.cam=true;
  const notes=classNotes(ev); let k=0;
  const online=ev.mode==='线上';
  $('#room').innerHTML=`
    <div class="room-top"><div class="ttl">${esc(ev.title)} · ${esc(u.name)}<small>${online?'技能换换课堂 · '+esc(ev.code):'线下课程 · '+esc(ev.place)}</small></div><span class="rec">小换记录中</span><span class="clock" id="rclock">00:00 / ${ev.dur}:00</span></div>
    <div class="room-body">
      <div class="stage">${online?`
        <div class="tile"><div class="talk">${avatarHTML(u,128)}</div><div class="caption" id="rcap">${esc(u.name)} 已加入课堂</div><span class="nm">${I('mic')}${esc(u.name)}</span></div>
        <div class="tile me" id="mytile">${avatarHTML({id:'me',name:P.name},48)}<span class="nm" id="mynm">${I('mic')}我</span></div>`:`
        <div class="tile"><div class="offline-card"><div class="pin">${I('pin')}</div><h3 style="margin:0 0 6px;font-weight:600">线下课程进行中</h3><p style="color:#a1a1aa;margin:0 0 14px">${esc(ev.place)}</p><p style="margin:0;font-size:14px">你已签到 ${fmtHM(Date.now())} · ${esc(u.name)} 已到达</p></div><div class="caption" id="rcap">小换正在记录课堂要点</div></div>`}
      </div>
      <aside class="notes"><h4><span class="orb breathe"></span>AI 课堂笔记</h4><div class="nsub">小换自动记录要点，课后发给你们俩</div><div id="rnotes"></div></aside>
    </div>
    <div class="room-ctl">${online?`<button class="rbtn" data-act="mic" title="麦克风">${I('mic')}</button><button class="rbtn" data-act="cam" title="摄像头">${I('video')}</button><button class="rbtn" data-act="share" title="共享屏幕">${I('screen')}</button>`:''}<button class="rbtn end" data-act="endClass">${I('phone')}结束课程</button></div>`;
  $('#room').classList.add('show');
  clearInterval(ROOM.timer);
  const addNote=()=>{
    if(k>=notes.length){ clearInterval(ROOM.timer); return; }
    const box=$('#rnotes'); if(!box) return;
    box.insertAdjacentHTML('beforeend',`<div class="note"><small>${fmtHM(Date.now())}</small>${esc(notes[k])}</div>`);
    const cap=$('#rcap'); const topic=notes[k].split(/[：，,]/)[0];
    if(cap) cap.textContent=`${u.name}：我们来看「${topic}」`;
    k++;
  };
  setTimeout(addNote,1200); ROOM.timer=setInterval(addNote,3200);
}
function classNotes(ev){
  const key=Object.keys(NOTE_BANK).find(k=>skillMatch(k,ev.skill)) || 'default';
  const goal=state.profile.goal||'先入门，培养兴趣';
  return [`目标确认：${ev.learn?goal:'了解 TA 的基础和目标'}`, ...NOTE_BANK[key], '课后练习：每天练 15 分钟，下节课前拍个小视频发给对方'];
}
function endClass(){
  const ev=ROOM.ev; if(!ev) return;
  clearInterval(ROOM.timer); $('#room').classList.remove('show');
  const notes=[...document.querySelectorAll('#rnotes .note')].map(n=>n.lastChild.textContent);
  ev.status='done'; ev.ended=Date.now(); ev.notes=notes.length?notes:classNotes(ev).slice(0,3); ROOM.ev=null;
  billing(ev); save();
  go('chat','agent');
  FEEDBACK.ask(ev);
}
function billing(ev){
  if(ev.trial) return;
  const u=userById(ev.uid), h=Math.round(ev.dur/60*10)/10;
  if(ev.pay==='credit') addLedger(`向 ${u.name} 学「${ev.learn}」${h} 课时`,-h);
  else if(ev.pay==='earn') addLedger(`教 ${u.name}「${ev.teach}」${h} 课时`,h);
  else addLedger(`与 ${u.name} 技能互换 ${h} 课时（互抵）`,0);
}
function addLedger(t,d){ state.credits=Math.round((state.credits+d)*10)/10; state.ledger.unshift({t,d,at:Date.now()}); save(); renderSide(); }

/* =====================================================================

   ===================================================================== */
const FEEDBACK = {
  ask(ev){
    const u=userById(ev.uid);
    sayUI('agent',`课程结束了。和 **${u.name}** 的「${ev.title}」感觉怎么样？你的评价会帮其他同学找到靠谱的伙伴。`,ui=>ui.card(ui.col([
      ui.text('整体体验','h5'), ui.rating('/rating'),
      ui.text('印象标签','h5'), ui.choice('/tags',['讲解清晰','很有耐心','准时守约','干货满满','氛围轻松','节奏偏快','内容偏简单'],7),
      ui.field('想对 TA 说点什么（选填）','/comment','例如：第一次觉得入门没那么难'),
      ui.text('接下来','h5'), ui.choice('/next',[ev.trial?'继续约正式课':'约下一节课','看看其他伙伴','暂时不用'],1),
      ui.row([ui.button('提交评价','fb.submit',{eid:ev.id},true,'check')])
    ])),{rating:5,tags:['讲解清晰','很有耐心'],comment:'',next:[ev.trial?'继续约正式课':'约下一节课']},{ms:800});
  },
  submit(eid,s){
    const ev=state.events.find(e=>e.id===eid), u=userById(ev.uid), d=s.data, r=+d.rating||5, next=(d.next||[])[0];
    ev.rating=r; save();
    const h=Math.round(ev.dur/60*10)/10;
    me('agent',`${'★'.repeat(r)}${'☆'.repeat(5-r)}　${(d.tags||[]).join('、')}${d.comment?'\n'+d.comment:''}`);
    say('agent',`谢谢反馈，你的 ${r} 星评价已同步到 ${u.name} 的信用档案。\n${ev.trial?'这节是试听课，**不扣时间币**。':(ev.pay==='credit'?`本节扣除 ${h} 时间币，余额 **${state.credits}**。`:ev.pay==='earn'?`你获得了 ${h} 时间币，余额 **${state.credits}**。`:'本节为技能互换，课时互抵，不花时间币。')}`,{ms:800});
    say('agent','这是我整理的本节课笔记，已同时发给你们俩：\n'+(ev.notes||[]).map(n=>'· '+n).join('\n'),{ms:1000,think:'正在整理课堂笔记'});
    if(next==='继续约正式课'||next==='约下一节课'){
      const P=state.profile; const dur=parseInt(P.dur)||60;
      const base=BOOK.laterSlot(u); const start=base>ev.start+DAY?base:base+7*DAY;
      const n=state.events.filter(e=>e.uid===ev.uid&&!e.trial).length+1;
      const ev2=mkEvent({uid:ev.uid,start,dur,trial:false,mode:ev.mode,place:ev.place,n});
      enqueue('agent', async()=>{
        state.events.push(ev2); save(); renderSide();
        push(ev.uid,{from:'agent',text:`你们的第 ${n} 节正式课已约好：${fmtWhen(ev2.start)}，${dur} 分钟，${ev2.mode}。已同步到双方日程。`});
        push(ev.uid,{from:ev.uid,text:'太好了，下次见！记得把练习视频发我～'});
      });
      sayUI('agent',`已经帮你和 ${u.name} 约好下一节正式课（${P.freq}，每次 ${dur} 分钟），TA 也确认了。`,ui=>eventCardUI(ui,ev2,{head:'已同步到双方日程'}),{},{ms:1100,think:'正在约下一节课'});
    } else if(next==='看看其他伙伴'){ say('agent','好的，我再帮你看看其他合适的伙伴。',{ms:500}); AGENT.match([ev.uid]); }
    else say('agent','好的，需要的时候随时叫我。',{ms:500});
  }
};

function suggestions(tid){
  if(tid==='agent'){
    if(state.onb==='teach') return ['我会 Python 和英语口语','我会弹吉他和唱歌','我擅长做饭和烘焙'];
    if(state.onb==='learn') return ['想学吉他和摄影','想学日语','想学健身和瑜伽'];
    if(state.onb==='done') return ['帮我重新匹配','我的课程安排','我还有多少时间币','修改我的档案'];
    return [];
  }
  const th=thread(tid); if(!th||!state.profile) return [];
  const x=th.m, P=state.profile, st=th.stage||0;
  const goal=P.goal||(GOAL_HINT[x.learn]||'').replace('比如：','');
  if(state.events.some(e=>e.uid===tid)) return ['好的，到时候见','需要提前准备什么吗？','谢谢你！'];
  if(st===0) return x.type==='both'?[`你好！我想学${x.learn}，可以用${x.teach}跟你换吗？`,`嗨，看到你也想学${x.teach}，我们互换吧`]:x.type==='learn'?[`你好！想跟你学${x.learn}，可以用时间币约课吗？`,`你好，请问你一般怎么教${x.learn}？`]:[`你好！看到你想学${x.teach}，我可以教你`,`我${x.teach}还不错，可以带你入门`];
  if(st===1) return x.type==='teach'?['我会先了解你的基础，再从最实用的部分讲起','我习惯边做小项目边学']:[goal?`我现在${x.myLevel}，${goal}`:`我现在${x.myLevel}，想先入门试试`,'零基础，想先培养兴趣'];
  if(st===2) return [`我${P.avail[0]}比较方便，线上就行`,'周末可以线下见面','我时间比较灵活，你定吧'];
  if(st===3) return ['好呀，今天先试听一下','周末那个时间可以','线上就好'];
  return ['好的，谢谢','到时候见'];
}
function updateSuggest(){ const el=$('#suggest'); if(!el) return; el.innerHTML=suggestions(state.active).map(s=>`<button data-act="sug">${esc(s)}</button>`).join(''); }

    ${up.length?`<div class="sech">待上课 · ${up.length}</div>${up.map(card).join('')}`:''}
    ${done.length?`<div class="sech">已完成 · ${done.length}</div>${done.map(card).join('')}`:''}
    ${evs.length&&!shown.length?`<div class="empty"><div class="ei">${I('calendar')}</div>这一天没有课程</div>`:''}
  </div></div>`;
}

/* ---- 我的 ---- */
function renderMe(){
  const P=state.profile;
  if(!P){ $('#main').innerHTML=`${pageTop('我的档案')}<div class="page"><div class="page-in"><h1>我的档案</h1><div class="sub">技能档案由小换根据对话生成</div><div class="empty"><div class="ei">${I('user')}</div><h3>还没有技能档案</h3>和小换聊 1 分钟就能生成<div style="margin-top:16px"><button class="btn pri" data-act="thread" data-tid="agent">${I('sparkle')}去和小换聊聊</button></div></div></div></div>`; return; }
  const done=state.events.filter(e=>e.status==='done');
  const hrs=Math.round(done.reduce((a,e)=>a+e.dur,0)/60*10)/10;
  $('#main').innerHTML=`${pageTop('我的档案')}<div class="page"><div class="page-in">
    <h1>我的档案</h1><div class="sub">技能档案由小换根据对话生成，随时可以让小换帮你更新</div>
    <div class="grid2">
      <div class="card"><div class="pcard-cover" style="background:${coverOf('me'+P.name)};height:84px"></div>
        <div class="pad" style="padding-top:0">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:-30px;position:relative;z-index:1"><span style="display:inline-flex;border-radius:50%;border:3px solid var(--panel);box-shadow:var(--shadow-sm)">${avatarHTML({id:'me',name:P.name},64)}</span><button class="btn" data-act="edit">${I('sparkle')}让小换更新档案</button></div>
          <div style="font-size:19px;font-weight:650;margin-top:10px">${esc(P.name)}</div>
          <div style="font-size:13px;color:var(--muted)">${esc(P.city)} · ${done.length?`已上 ${done.length} 节课`:'新加入'}</div>
          ${P.exp?`<div style="font-size:13.5px;color:var(--text2);margin-top:10px">“${esc(P.exp)}”</div>`:''}
          <div class="kv">能教</div><div class="tags">${P.teach.map(t=>tagHTML(t.skill,'teach',t.level)).join('')}</div>
          <div class="kv">想学</div><div class="tags">${P.learn.map(l=>tagHTML(l.skill,'learn',l.level)).join('')}</div>
          ${P.goal?`<div class="kv">目标</div><div style="font-size:14px">${esc(P.goal)}</div>`:''}
          <div class="kv">偏好</div><div class="tags">${[[P.mode==='都可以'?'线上 / 线下':P.mode,'video'],[P.dur+' / 次','clock'],[P.freq,'repeat'],...P.avail.map(a=>[a,'calendar'])].map(([x,ic])=>`<span class="badge">${I(ic)}${esc(x)}</span>`).join('')}</div>
        </div></div>
      <div class="card"><div class="pad">
        <h3><span class="coin" style="width:18px;height:18px;font-size:11px">¢</span>时间币</h3>
        <div class="stats"><div class="stat"><b>${state.credits}</b><span>余额</span></div><div class="stat"><b>${done.length}</b><span>已上课程</span></div><div class="stat"><b>${hrs}</b><span>累计小时</span></div></div>
        <div class="rules"><div>教别人 1 小时 +1 币，向别人学 1 小时 −1 币</div><div>技能互换的课时互相抵扣，不花币</div><div>每段新关系首课 15 分钟试听免费</div></div>
        <div class="ledger">${state.ledger.map(l=>`<div><span>${esc(l.t)}</span><span class="${l.d>0?'plus':l.d<0?'minus':'zero'}">${l.d>0?'+':''}${l.d}</span></div>`).join('')}</div>
      </div></div>
    </div>
    <div style="margin-top:24px;text-align:center"><button class="btn ghost" data-act="logout">${I('logout')}退出登录</button></div>
  </div></div>`;
}

/* =====================================================================
   事件
   ===================================================================== */
document.addEventListener('click',e=>{
  const b2=e.target.closest('[data-a2btn]'); if(b2){ onA2Button(b2.closest('.a2ui').dataset.sid,b2.dataset.a2btn); return; }
  const chip=e.target.closest('.a2-chip'); if(chip){
    const sid=chip.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; if(!s||s.locked) return;
    const cid=chip.closest('[data-a2mc]').dataset.a2mc, p=s.components[cid].MultipleChoice, v=chip.dataset.v;
    let sel=(getPath(s.data,p.selections.path)||[]).slice();
    if(p.maxAllowedSelections===1) sel=[v]; else if(sel.includes(v)) sel=sel.filter(x=>x!==v); else { if(sel.length>=p.maxAllowedSelections){ toast(`最多选 ${p.maxAllowedSelections} 个`); return; } sel.push(v); }
    setPath(s.data,p.selections.path,sel); save();
    chip.parentElement.querySelectorAll('.a2-chip').forEach(c=>c.classList.toggle('on',sel.includes(c.dataset.v)));
    return;
  }
  const star=e.target.closest('[data-a2rate] button'); if(star){
    const sid=star.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; if(!s||s.locked) return;
    const p=s.components[star.parentElement.dataset.a2rate].Rating, n=+star.dataset.n;
    setPath(s.data,p.value.path,n); save();
    star.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.n<=n));
    return;
  }
  const a=e.target.closest('[data-act]');
  if(!a){ const link=e.target.closest('a[href*="#room="]'); if(link){ e.preventDefault(); openRoomByHash(link.getAttribute('href')); } return; }
  const act=a.dataset.act;
  if(act==='go') go(a.dataset.view);
  else if(act==='thread') go('chat',a.dataset.tid);
  else if(act==='send') send();
  else if(act==='sug') send(a.textContent);
  else if(act==='book'){ if(thread(a.dataset.uid)) BOOK.card(a.dataset.uid,true); }
  else if(act==='join') joinClass(a.dataset.eid);
  else if(act==='ics') downloadICS(a.dataset.eid);
  else if(act==='calday'){ state.calDay=a.dataset.d?+a.dataset.d:null; renderCal(); }
  else if(act==='openDrawer'){ UIS.drawer=true; $('#app').classList.add('drawer'); }
  else if(act==='closeDrawer'){ UIS.drawer=false; $('#app').classList.remove('drawer'); }
  else if(act==='nclose') $('#notif').classList.remove('show');
  else if(act==='soon') toast(a.title==='语音输入'?'请允许浏览器使用麦克风后再试':'当前对话暂不支持发送附件');
  else if(act==='edit'){ go('chat','agent'); say('agent','好的，我们重新过一遍，之前填的都帮你保留了。',{ms:450}); AGENT.askTeach(); }
  else if(act==='logout'){ if(confirm('确定退出登录吗？本设备上的对话和日程将被清除。')){ try{localStorage.removeItem(KEY);}catch(_){} location.reload(); } }
  else if(act==='mic'){ ROOM.mic=!ROOM.mic; a.classList.toggle('off',!ROOM.mic); a.innerHTML=I(ROOM.mic?'mic':'micoff'); const n=$('#mynm'); if(n) n.innerHTML=I(ROOM.mic?'mic':'micoff')+'我'; }
  else if(act==='cam'){ ROOM.cam=!ROOM.cam; a.classList.toggle('off',!ROOM.cam); a.innerHTML=I(ROOM.cam?'video':'videooff'); const t=$('#mytile'); if(t) t.classList.toggle('off',!ROOM.cam); }
  else if(act==='share'){ a.classList.toggle('off'); toast(a.classList.contains('off')?'屏幕共享已开启':'屏幕共享已停止'); }
  else if(act==='endClass') endClass();
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('[data-a2bind]'); if(inp){ const s=state.surfaces[inp.closest('.a2ui').dataset.sid]; if(s&&!s.locked){ setPath(s.data,inp.dataset.a2bind,inp.value); save(); } return; }
  if(e.target.id==='input'){ const t=e.target; t.style.height='auto'; t.style.height=Math.min(160,t.scrollHeight)+'px'; const b=$('#sendBtn'); if(b) b.disabled=!t.value.trim(); }
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='input' && e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); send(); }
  else if(e.target.classList && e.target.classList.contains('a2-input') && e.key==='Enter' && !e.isComposing && e.keyCode!==229){ const btn=e.target.closest('.a2ui').querySelector('.a2-btn.pri'); if(btn) btn.click(); }
  else if(e.key==='Escape'){ UIS.drawer=false; $('#app').classList.remove('drawer'); }
});
function openRoomByHash(h){ const code=(String(h).split('#room=')[1]||'').trim(); const ev=state.events.find(e=>e.code===code); if(ev) joinClass(ev.id); else toast('课堂链接已失效或不属于当前账号'); }
window.addEventListener('hashchange',()=>{ if(location.hash.startsWith('#room=')){ const h=location.hash; history.replaceState(null,'',location.pathname+location.search); openRoomByHash(h); } });

/* =====================================================================
   启动
   ===================================================================== */
if(/[?&]a2ui\b/.test(location.search)) $('#insp').classList.add('show');
window.A2UI = {log:A2UI_LOG, surfaces:()=>state.surfaces};
state.view='chat';
renderAll();
if(!state.started) AGENT.start(); else AGENT.resume();
if(location.hash.startsWith('#room=')){ const h=location.hash; history.replaceState(null,'',location.pathname+location.search); setTimeout(()=>openRoomByHash(h),300); }
setInterval(tick,2000); tick();
</script>
