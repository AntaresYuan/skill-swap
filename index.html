<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>技能换换 · AI 技能交换</title>
<meta name="description" content="用你会的，换你想学的。AI 顾问小换帮你建立技能档案、匹配交换伙伴、约课并提醒上课。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='a' cx='.3' cy='.3' r='.9'><stop offset='0' stop-color='%23fff' stop-opacity='.9'/><stop offset='.35' stop-color='%23b18cff'/><stop offset='.7' stop-color='%237c5cff'/><stop offset='1' stop-color='%23ff7ab6'/></radialGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23a)'/></svg>">
<script>try{var t=localStorage.getItem('skillswap.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#ffffff;--side:#f8f8f9;--panel:#ffffff;--text:#18181b;--text2:#3f3f46;--muted:#71717a;--faint:#a1a1aa;
  --line:#e7e7ea;--line2:#f0f0f2;--soft:#f4f4f5;--hover:#efeff1;
  --primary:#18181b;--on-primary:#ffffff;
  --accent:#6d5bf6;--accent-soft:#f3f1ff;--accent-line:#e2dcff;
  --teach:#0f9f6e;--teach-soft:#e9f7f1;--learn:#ea6a12;--learn-soft:#fff2e8;
  --gold:#f5a524;--red:#ef4444;--green:#22c55e;
  --brand:linear-gradient(135deg,#7c5cff 0%,#b65cff 50%,#ff7ab6 100%);
  --shadow-xs:0 1px 2px rgba(24,24,27,.05);
  --shadow-sm:0 1px 2px rgba(24,24,27,.04),0 2px 8px rgba(24,24,27,.05);
  --shadow-md:0 4px 12px rgba(24,24,27,.06),0 12px 32px rgba(24,24,27,.08);
  --shadow-lg:0 12px 28px rgba(24,24,27,.10),0 32px 80px rgba(24,24,27,.14);
  --ev-s:85%;--ev-l:95%;--ev-t:30%;--ev-b:55%;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f0f11;--side:#141416;--panel:#18181b;--text:#ededef;--text2:#d4d4d8;--muted:#a1a1aa;--faint:#71717a;
  --line:#27272a;--line2:#1f1f22;--soft:#1f1f23;--hover:#232327;--primary:#fafafa;--on-primary:#18181b;
  --accent:#9d8cff;--accent-soft:#1e1a33;--accent-line:#352d5c;--teach:#34d399;--teach-soft:#10261e;--learn:#fb923c;--learn-soft:#2b1a0e;
  --shadow-xs:none;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 30px rgba(0,0,0,.45);--shadow-lg:0 24px 80px rgba(0,0,0,.6);
  --ev-s:35%;--ev-l:20%;--ev-t:86%;--ev-b:60%;color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0f0f11;--side:#141416;--panel:#18181b;--text:#ededef;--text2:#d4d4d8;--muted:#a1a1aa;--faint:#71717a;
  --line:#27272a;--line2:#1f1f22;--soft:#1f1f23;--hover:#232327;--primary:#fafafa;--on-primary:#18181b;
  --accent:#9d8cff;--accent-soft:#1e1a33;--accent-line:#352d5c;--teach:#34d399;--teach-soft:#10261e;--learn:#fb923c;--learn-soft:#2b1a0e;
  --shadow-xs:none;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 30px rgba(0,0,0,.45);--shadow-lg:0 24px 80px rgba(0,0,0,.6);
  --ev-s:35%;--ev-l:20%;--ev-t:86%;--ev-b:60%;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
kbd{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--panel)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.fill{fill:currentColor;stroke:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:orbspin .7s linear infinite;display:inline-block;flex:none}

/* ---------- orb ---------- */
.orb{display:inline-block;flex:none;border-radius:50%;position:relative;background:
  radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 32%),
  conic-gradient(from 210deg,#7c5cff,#b65cff,#ff7ab6,#ffb36b,#7c5cff);box-shadow:inset 0 -2px 6px rgba(60,20,140,.25)}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 80%,rgba(124,92,255,.5),transparent 60%)}
.orb.spinning{animation:orbspin 1.6s linear infinite}
@keyframes orbspin{to{transform:rotate(360deg)}}
.orb.breathe{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);filter:saturate(1.25) brightness(1.05)}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:272px 1fr;height:100vh;height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh;position:relative}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;font-weight:650;font-size:16px;letter-spacing:.02em}
.brand small{font-weight:500;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.sbtn{margin:4px 10px 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:13.5px;box-shadow:var(--shadow-xs);text-align:left}
.sbtn:hover{color:var(--text);border-color:var(--faint)}
.sbtn span{flex:1}
.nav{padding:2px 10px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:0;background:none;color:var(--text2);font-size:14px;text-align:left;width:100%;transition:background .15s}
.nv:hover{background:var(--hover)}
.nv.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-xs);outline:1px solid var(--line)}
.nv .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nv .cnt.hot{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.sec-l{font-size:12px;color:var(--faint);padding:18px 20px 6px;font-weight:500}
.threads{flex:1;overflow-y:auto;padding:0 10px 10px}
.th{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.th:hover{background:var(--hover)}
.th.on{background:var(--panel);box-shadow:var(--shadow-xs);outline:1px solid var(--line)}
.th .bd{flex:1;min-width:0}
.th .nm{font-size:14px;font-weight:550;display:flex;justify-content:space-between;gap:6px}
.th .nm small{font-weight:400;font-size:11px;color:var(--faint);white-space:nowrap}
.th .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .pv.typing{color:var(--accent)}
.th .ud{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.avw{position:relative;display:inline-flex;flex:none}
.avw .ol{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--side)}
.side-tip{margin:4px 10px;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--muted);line-height:1.6}
.acct{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.acct:hover{background:var(--hover)}
.acct .nm{font-size:14px;font-weight:550;line-height:1.3}
.acct .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.acct>svg{margin-left:auto;color:var(--faint)}
.coin{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#ffd36b,#f5a524);color:#7a4a00;font-size:9px;font-weight:800;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.pop{position:absolute;left:10px;right:10px;bottom:66px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:20;opacity:0;transform:translateY(6px) scale(.98);pointer-events:none;transition:.18s var(--ease);transform-origin:bottom center}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop .pi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:13.5px;text-align:left;color:var(--text2)}
.pop .pi:hover{background:var(--hover);color:var(--text)}
.pop .pi kbd{margin-left:auto}
.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.seg{display:flex;gap:2px;background:var(--soft);border-radius:9px;padding:2px;margin:4px 10px 6px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:5px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button svg{width:14px;height:14px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-xs)}
.pop .pl{font-size:11.5px;color:var(--faint);padding:6px 12px 0}
.main{min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);position:relative}
.scrim{display:none}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;flex:none;line-height:1;letter-spacing:0}
.vf{color:#3b82f6;display:inline-flex}
.vf svg{width:15px;height:15px}

/* ---------- chat ---------- */
.head{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(12px);position:relative;z-index:2}
.head .who{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:4px 6px 4px 4px;margin-left:-4px;border-radius:10px;text-align:left}
button.who:hover{background:var(--hover)}
.head .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;line-height:1.3}
.head .s{font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.head .s .dotg{width:6px;height:6px;border-radius:50%;background:var(--green)}
.head .s.typing{color:var(--accent)}
.head .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.menu{display:none;border:0;background:none;padding:6px;margin-left:-6px;border-radius:8px;color:var(--text)}
.menu:hover{background:var(--hover)}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 11px;font-size:13px;font-weight:550;white-space:nowrap;box-shadow:var(--shadow-xs);position:relative}
.hbtn:hover{background:var(--hover)}
.hbtn .spark{color:var(--accent)}
.hbtn.glow{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.hbtn.glow::after{content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain}
.stream-col{max-width:768px;margin:0 auto;padding:28px 24px 16px;display:flex;flex-direction:column;gap:22px}
.hero{text-align:center;padding:30px 0 8px;position:relative;isolation:isolate}
.hero::before{content:'';position:absolute;left:50%;top:-30px;width:520px;height:260px;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,#b65cff 18%,transparent),transparent);filter:blur(10px);pointer-events:none;z-index:-1}
.hero .orb{width:58px;height:58px}
.hero h1{font-size:26px;font-weight:650;letter-spacing:.02em;margin:18px 0 6px}
.hero p{color:var(--muted);margin:0 auto;max-width:460px;font-size:14.5px}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.pills span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}
.pills svg{width:14px;height:14px;color:var(--accent)}
.tsep{align-self:center;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.m{display:flex;gap:12px;align-items:flex-start;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.me{flex-direction:column;align-items:flex-end;gap:4px}
.m .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.m.ai>.orb{width:26px;height:26px;margin-top:1px}
.ai-text{font-size:15px;line-height:1.75;color:var(--text);max-width:100%;word-break:break-word}
.ai-text b{font-weight:620}
.ai-text a,.box a{color:var(--accent);text-decoration:none;word-break:break-all}
.stream.typing{white-space:pre-wrap}
.stream.typing::after{content:'';display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--text);animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.mact{display:flex;gap:2px;margin:-6px 0 -4px -6px;opacity:0;transition:opacity .15s}
.m.ai:hover .mact,.mact:focus-within,.mact.has{opacity:1}
.mact button{border:0;background:none;color:var(--faint);width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.mact button:hover{background:var(--hover);color:var(--text)}
.mact button.on{color:var(--accent)}
.mact svg{width:15px;height:15px}
.think{border:0;margin:0;max-width:100%}
.think summary{list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);user-select:none}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--text)}
.think summary svg{width:14px;height:14px}
.think summary .chev{transition:transform .2s}
.think[open] summary .chev{transform:rotate(180deg)}
.think ol{margin:8px 0 0;padding:4px 0 4px 16px;border-left:2px solid var(--line);list-style:none;font-size:13px;color:var(--muted);display:grid;gap:4px}
.think ol li{position:relative}
.think ol li::before{content:'';position:absolute;left:-21px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--panel);border:2px solid var(--faint)}
.bubble{padding:9px 15px;border-radius:18px;max-width:min(560px,82%);word-break:break-word;font-size:15px;line-height:1.6}
.m.me .bubble{background:var(--soft);border-bottom-right-radius:6px}
.rcpt{font-size:11px;color:var(--faint);padding-right:4px;display:flex;align-items:center;gap:3px}
.rcpt svg{width:13px;height:13px;color:var(--accent)}
.m.peer .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow-xs)}
.m.peer>.av{margin-top:2px}
.ai-in{display:flex;flex-direction:column;gap:6px;max-width:100%}
.ai-in .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ai-in .lab b{font-weight:600;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.ai-in .box{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:10px 14px;font-size:14.5px;line-height:1.7}
.sys{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.sys::before,.sys::after{content:'';flex:1;height:1px;background:var(--line)}
.thinking{display:flex;align-items:center;gap:10px;height:26px}
.shimmer{font-size:14px;font-weight:500;background:linear-gradient(90deg,var(--faint) 0%,var(--faint) 40%,var(--text) 50%,var(--faint) 60%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.dots{display:inline-flex;gap:4px;padding:6px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.dock{flex:none;padding:0 24px 10px;position:relative}
.dock::before{content:'';position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.dock-in{max-width:768px;margin:0 auto;position:relative}
.jump{position:absolute;left:50%;top:-50px;transform:translate(-50%,8px);display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:.2s var(--ease);z-index:3;color:var(--text2)}
.jump.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.jump svg{width:15px;height:15px}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.suggest:empty{display:none}
.suggest button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow-xs);transition:.15s;animation:rise .3s var(--ease) both}
.suggest button:nth-child(2){animation-delay:.05s}.suggest button:nth-child(3){animation-delay:.1s}.suggest button:nth-child(4){animation-delay:.15s}
.suggest button:hover{border-color:var(--faint);color:var(--text)}
.composer{border:1px solid var(--line);background:var(--panel);border-radius:22px;box-shadow:var(--shadow-md);padding:12px 12px 10px 18px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--faint)}
.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;max-height:160px;min-height:26px;line-height:1.6;font-size:15px;padding:2px 0}
.composer textarea::placeholder{color:var(--faint)}
.c-row{display:flex;align-items:center;gap:4px;margin-top:8px}
.ib{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.rec{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.c-row .grow{flex:1}
.c-hint{font-size:12px;color:var(--faint);margin-right:8px}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;transition:.15s}
.send:disabled{background:var(--line);color:var(--faint);cursor:default}
.send:not(:disabled):active{transform:scale(.92)}
.send svg{width:17px;height:17px;stroke-width:2.2}
.disclaim{text-align:center;font-size:11.5px;color:var(--faint);padding:8px 0 2px}

/* ---------- A2UI ---------- */
.a2ui{width:100%;max-width:620px;transition:opacity .35s,transform .35s var(--ease)}
.a2ui.pre{opacity:0;transform:translateY(8px)}
.a2ui:has(.carousel){max-width:100%}
.a2-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);min-width:0}
.a2-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.a2-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.a2-row.between{justify-content:space-between;flex-wrap:nowrap}
.a2-row .a2-row{flex-wrap:nowrap}
.a2-row>.a2-col{gap:2px;min-width:0}
.a2-list.v{display:grid;gap:12px}
.carousel{position:relative;margin:0 -24px}
.a2-list.h{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 24px 14px;scroll-padding:0 24px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%)}
.a2-list.h::-webkit-scrollbar{display:none}
.car-item{flex:0 0 296px;scroll-snap-align:start;display:flex;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.car-item>.a2-card{flex:1;display:flex;flex-direction:column;padding:0;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.car-item>.a2-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.car-item>.a2-card>.a2-col{flex:1;padding:0 18px 18px;gap:12px}
.car-item>.a2-card>.a2-col>.a2-row:last-child{margin-top:auto;flex-wrap:nowrap}
.car-item .a2-btn.pri{flex:1}
.car-nav{position:absolute;top:calc(50% - 26px);width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-md);display:grid;place-items:center;z-index:2;opacity:0;transition:opacity .2s;color:var(--text)}
.carousel:hover .car-nav{opacity:1}
.car-nav:disabled{opacity:0!important;pointer-events:none}
.car-nav.prev{left:8px}.car-nav.next{right:8px}
.car-foot{display:flex;justify-content:center;gap:5px;margin-top:-4px}
.car-foot i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:.25s var(--ease)}
.car-foot i.on{width:16px;background:var(--text)}
.a2-hr{border:0;border-top:1px solid var(--line2);margin:2px 0;width:100%}
.t-h3{font-size:18px;font-weight:650;line-height:1.35}
.t-h4{font-size:16px;font-weight:650;line-height:1.4}
.t-h5{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--text)}
.t-caption{font-size:13px;color:var(--muted);line-height:1.6}
.t-body{font-size:14px;line-height:1.65;color:var(--text2)}
.t-body b,.t-caption b{color:var(--text);font-weight:600}
.lbl{font-size:12px;color:var(--faint);min-width:52px}
.a2-chips{display:flex;flex-wrap:wrap;gap:8px}
.a2-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:999px;padding:6px 14px;font-size:13.5px;transition:background .15s,border-color .15s,color .15s,transform .1s;box-shadow:var(--shadow-xs)}
.a2-chip:hover{border-color:var(--faint);color:var(--text)}
.a2-chip:active,.slot:active,.a2-btn:active{transform:scale(.97)}
.a2-chip svg{width:14px;height:14px}
.a2-chip .ck{stroke-width:2.6;display:none}
.a2-chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.a2-chip.on .ck{display:inline}
.a2-field{display:grid;gap:6px;width:100%}
.a2-field>span{font-size:13px;color:var(--muted)}
.a2-input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);outline:0;width:100%;transition:.12s}
.a2-input::placeholder{color:var(--faint)}
.a2-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.a2-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 16px;font-weight:560;font-size:14px;transition:background .15s,opacity .15s,transform .1s;box-shadow:var(--shadow-xs);white-space:nowrap}
.a2-btn:hover{background:var(--hover)}
.a2-btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.a2-btn.pri:hover{opacity:.88}
.a2-btn svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:13px;background:var(--soft);color:var(--text);white-space:nowrap;font-weight:500}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.tag em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.tag.teach{background:var(--teach-soft)}.tag.teach i{background:var(--teach)}
.tag.learn{background:var(--learn-soft)}.tag.learn i{background:var(--learn)}
.lvl{display:inline-flex;gap:2px;align-items:center}
.lvl i{width:4px;height:12px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--teach)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;align-self:flex-start;background:var(--panel)}
.badge svg{width:13px;height:13px}
.badge.pri{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.teach{border-color:transparent;background:var(--teach-soft);color:var(--teach);font-weight:600}
.badge.learn{border-color:transparent;background:var(--learn-soft);color:var(--learn);font-weight:600}
.meta{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);line-height:1.5;min-width:0}
.meta svg{width:15px;height:15px;color:var(--muted);margin-top:2px}
.meta span{min-width:0;word-break:break-all}
.meta a{color:var(--accent);text-decoration:none}
.prog{display:grid;gap:7px;margin:-2px 0 2px}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.prog-l b{color:var(--text);font-weight:600}
.prog-b{display:grid;gap:4px}
.prog-b i{height:3px;border-radius:2px;background:var(--line)}
.prog-b i.on{background:var(--primary)}
.a2-rating{display:flex;align-items:center;gap:12px}
.a2-rating .stars{display:flex;gap:2px}
.a2-rating button{border:0;background:none;padding:2px;color:var(--line);transition:transform .12s,color .12s}
.a2-rating button:hover{transform:scale(1.12)}
.a2-rating button svg{width:28px;height:28px}
.a2-rating button.on{color:var(--gold)}
.a2-rating .stars.pv button{color:var(--line)}
.a2-rating .stars.pv button.pv{color:var(--gold)}
.a2-rating .rl{font-size:13.5px;color:var(--muted);min-width:64px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--faint)}
.step .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line)}
.step.done{color:var(--text2)}
.step.done .ic{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.step.done .ic svg{width:12px;height:12px;stroke-width:3}
.step.run{color:var(--text)}
.step.run .ic{border-color:var(--accent);border-top-color:transparent;animation:orbspin .8s linear infinite}
.step small{color:var(--faint);margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.tool summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:550}
.tool summary::-webkit-details-marker{display:none}
.tool summary .ok{width:20px;height:20px;border-radius:50%;background:var(--teach);color:#fff;display:grid;place-items:center}
.tool summary .ok svg{width:12px;height:12px;stroke-width:3}
.tool summary small{color:var(--faint);font-weight:400;font-size:12.5px}
.tool summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.tool[open] summary .chev{transform:rotate(180deg)}
.tool .steps{margin-top:14px}
.pcard-h{margin:0 -18px}
.pcard-cover{height:64px;position:relative}
.pcard-top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px;margin-top:-29px;position:relative;z-index:1}
.pcard-top .av{border:3px solid var(--panel);box-shadow:var(--shadow-sm)}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding-bottom:2px}
.score b{font-size:20px;font-weight:700;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{font-size:11px;color:var(--muted)}
.pcard-name{padding:10px 18px 0}
.pcard-name .n{font-weight:650;font-size:16px;display:flex;align-items:center;gap:5px}
.pcard-name .s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard-name .s svg{width:12px;height:12px;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;transition:border-color .15s,background .15s,transform .1s;box-shadow:var(--shadow-xs)}
.slot small{font-size:11.5px;color:var(--muted)}
.slot b{font-size:20px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.slot span{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.slot em{position:absolute;top:-8px;right:8px;font-style:normal;font-size:10.5px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;line-height:17px}
.slot:hover{border-color:var(--faint)}
.slot.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);background:var(--soft)}
.map{height:118px;border-radius:12px;position:relative;overflow:hidden;border:1px solid var(--line);background:
  linear-gradient(90deg,transparent 46%,color-mix(in srgb,var(--panel) 90%,transparent) 46% 54%,transparent 54%),
  linear-gradient(0deg,transparent 58%,color-mix(in srgb,var(--panel) 90%,transparent) 58% 64%,transparent 64%),
  repeating-linear-gradient(90deg,transparent 0 38px,color-mix(in srgb,var(--panel) 70%,transparent) 38px 40px),
  repeating-linear-gradient(0deg,transparent 0 30px,color-mix(in srgb,var(--panel) 70%,transparent) 30px 32px),
  radial-gradient(120px 60px at 18% 25%,color-mix(in srgb,var(--teach) 18%,transparent),transparent 70%),
  var(--soft)}
.map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);width:28px;height:28px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--accent);box-shadow:var(--shadow-md);display:grid;place-items:center}
.map .pin::after{content:'';width:10px;height:10px;border-radius:50%;background:#fff}
.map .pulse{position:absolute;left:50%;top:44%;width:14px;height:6px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.2);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent);animation:ping 2s infinite}
.map .pl{position:absolute;left:12px;bottom:10px;right:12px;font-size:12.5px;font-weight:550;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;box-shadow:var(--shadow-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stl{display:flex;align-items:center;gap:8px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--text2)}
.stl.ok{background:var(--teach-soft);color:var(--teach);font-weight:550}
.stl.ok svg{width:16px;height:16px;stroke-width:2.4}
.ticket{display:flex;gap:14px;align-items:stretch}
.tk-date{flex:none;align-self:flex-start;width:60px;border-radius:12px;border:1px solid var(--line);overflow:hidden;text-align:center;background:var(--panel);display:flex;flex-direction:column}
.tk-date small{display:block;background:var(--red);color:#fff;font-size:11px;font-weight:600;line-height:20px}
.tk-date b{font-size:24px;font-weight:650;line-height:1.25;padding-top:3px;font-variant-numeric:tabular-nums}
.tk-date span{font-size:11px;color:var(--muted);padding-bottom:5px}
.tk-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.tk-title{font-weight:620;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.cd{font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent)}
.cd::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.cd.soon{background:#fff1e6;color:#c2410c}
.cd.live{background:#fee2e2;color:#dc2626}
.cd.live::before{animation:blink 1.2s infinite}
.cd.done{background:var(--teach-soft);color:var(--teach)}
:root[data-theme=dark] .cd.soon{background:#33200f;color:#fb923c}:root[data-theme=dark] .cd.live{background:#3a1515;color:#f87171}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .cd.soon{background:#33200f;color:#fb923c}:root:not([data-theme=light]) .cd.live{background:#3a1515;color:#f87171}}
.cpy{border:0;background:none;color:var(--faint);padding:0 3px;border-radius:5px;vertical-align:-3px}
.cpy:hover{color:var(--text);background:var(--hover)}
.cpy svg{width:14px;height:14px}
.rep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rep-grid div{background:var(--soft);border-radius:10px;padding:10px 12px}
.rep-grid b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
.rep-grid span{font-size:11.5px;color:var(--muted)}
.nlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.nlist li{display:flex;gap:8px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.nlist li svg{width:14px;height:14px;margin-top:3px;color:var(--accent)}
.nlist li.mine{color:var(--text)}
.nlist li.mine b{font-size:11px;font-weight:600;background:var(--soft);border-radius:5px;padding:0 5px;height:18px;margin-top:2px;flex:none}
.a2-done{display:flex;align-items:center;gap:10px;width:100%;max-width:520px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;text-align:left;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow-xs);transition:background .15s}
.a2-done:hover{background:var(--hover)}
.a2-done .ok{width:18px;height:18px;border-radius:50%;background:var(--teach-soft);color:var(--teach);display:grid;place-items:center;flex:none}
.a2-done .ok svg{width:11px;height:11px;stroke-width:3}
.a2-done b{color:var(--text);font-weight:600;white-space:nowrap}
.a2-done span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.a2-done>svg:last-child{color:var(--faint)}
.a2-fold{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-size:12.5px;padding:0;margin-bottom:-4px}
.a2ui.locked .a2-chip,.a2ui.locked .slot,.a2ui.locked .a2-input,.a2ui.locked .a2-rating{pointer-events:none}
.a2ui.locked .a2-chip:not(.on),.a2ui.locked .slot:not(.on){opacity:.4}
.a2ui.locked .a2-btn:not(.chosen){display:none}
.a2ui.locked .a2-btn.chosen{pointer-events:none;background:var(--soft);border-color:var(--line);color:var(--muted);box-shadow:none}

/* ---------- pages ---------- */
.page{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.page-in{max-width:1080px;width:100%;margin:0 auto;padding:28px 28px 40px;flex:1;display:flex;flex-direction:column;min-height:0}
.page h1{font-size:24px;font-weight:650;margin:0;letter-spacing:.02em}
.page .sub{color:var(--muted);font-size:14px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tools{display:flex;align-items:center;gap:8px}
.tools .wl{font-size:14px;font-weight:600;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.ibtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--text2);box-shadow:var(--shadow-xs)}
.ibtn:hover{background:var(--hover)}
.ibtn svg{width:16px;height:16px}
.segc{display:flex;gap:2px;background:var(--soft);border-radius:9px;padding:2px}
.segc button{border:0;background:none;border-radius:7px;padding:4px 12px;font-size:13px;color:var(--muted)}
.segc button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-xs);font-weight:550}
.wk{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:420px;box-shadow:var(--shadow-sm)}
.wk-head{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--line)}
.wk-head .wd{padding:10px 0 8px;text-align:center;border-left:1px solid var(--line2)}
.wk-head .wd small{display:block;font-size:11.5px;color:var(--muted)}
.wk-head .wd b{display:inline-grid;place-items:center;font-size:17px;font-weight:600;width:32px;height:32px;border-radius:50%;font-variant-numeric:tabular-nums}
.wk-head .wd.today small{color:var(--red);font-weight:600}
.wk-head .wd.today b{background:var(--red);color:#fff}
.wk-body{overflow-y:auto;flex:1;position:relative}
.wk-grid{display:grid;grid-template-columns:56px repeat(7,1fr);position:relative}
.wk-grid .gut{position:relative}
.wk-grid .gut span{position:absolute;right:8px;transform:translateY(-50%);font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint)}
.wk-grid .col{position:relative;border-left:1px solid var(--line2);background-image:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px 48px)}
.wk-grid .col.today{background-color:color-mix(in srgb,var(--accent) 3%,transparent)}
.wk-grid .col.past{background-color:color-mix(in srgb,var(--soft) 45%,transparent)}
.evb{position:absolute;left:3px;right:3px;border:0;border-radius:6px;padding:3px 7px;text-align:left;overflow:hidden;font-size:12px;line-height:1.35;background:hsl(var(--h) var(--ev-s) var(--ev-l));color:hsl(var(--h) 60% var(--ev-t));box-shadow:inset 3px 0 0 hsl(var(--h) 65% var(--ev-b));transition:transform .15s,box-shadow .15s;z-index:1}
.evb:hover{transform:translateY(-1px);box-shadow:inset 3px 0 0 hsl(var(--h) 65% var(--ev-b)),var(--shadow-md)}
.evb b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evb span{opacity:.8;white-space:nowrap}
.evb.short{display:flex;align-items:center;gap:6px;padding:0 7px;white-space:nowrap}
.evb.short b{flex:none;max-width:60%}
.evb.short span{overflow:hidden;text-overflow:ellipsis}
.evb.done{opacity:.6}
.evb.done b{text-decoration:line-through;text-decoration-thickness:1px}
.nowl{position:absolute;left:-1px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowl::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.ev{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);margin-bottom:10px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.ev:hover{box-shadow:var(--shadow-md)}
.ev .acts{display:flex;gap:8px}
.sech{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:550;white-space:nowrap;color:var(--text);box-shadow:var(--shadow-xs);transition:background .15s,opacity .15s,transform .1s}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;font-size:14px}
.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--muted)}
.empty .ei svg{width:22px;height:22px}
.empty h3{color:var(--text);font-size:16px;margin:0 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}
.card .pad{padding:20px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.kv{font-size:12.5px;color:var(--faint);margin:14px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.wallet{border-radius:16px;padding:18px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#8b6cff 0%,#5a3fe0 45%,#2a1d6e 100%);position:relative;overflow:hidden;margin-bottom:16px}
.wallet::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.wallet small{opacity:.75;font-size:12px}
.wallet b{display:block;font-size:34px;font-weight:700;line-height:1.2;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.wallet .row{display:flex;gap:18px;font-size:12px;opacity:.85}
.ledger div{display:flex;align-items:center;gap:10px;font-size:13px;padding:9px 0;border-top:1px solid var(--line2);color:var(--text2)}
.ledger .li{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--muted);flex:none}
.ledger .li svg{width:14px;height:14px}
.ledger .lt{flex:1;min-width:0}
.ledger .lt small{display:block;color:var(--faint);font-size:11.5px}
.plus{color:var(--teach);font-weight:600}.minus{color:var(--learn);font-weight:600}.zero{color:var(--faint)}
.rules{font-size:12.5px;color:var(--muted);display:grid;gap:4px;margin-bottom:14px;padding:12px 14px;background:var(--soft);border-radius:12px}
.topbar{display:none}

/* ---------- sheet / dialog / cmdk ---------- */
.sheet{position:fixed;inset:0;z-index:55;pointer-events:none}
.sheet .scrim2{position:absolute;inset:0;background:rgba(9,9,11,.32);opacity:0;transition:opacity .25s}
.sheet .panel{position:absolute;top:10px;right:10px;bottom:10px;width:min(440px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 20px));transition:transform .35s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.sheet.show{pointer-events:auto}
.sheet.show .scrim2{opacity:1}
.sheet.show .panel{transform:none}
.sh-x{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;border:0;background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--text)}
.sh-x:hover{background:var(--hover)}
.sh-body{flex:1;overflow-y:auto;padding:0 22px 22px}
.sh-cover{height:110px;margin:0 -22px}
.sh-top{margin-top:-36px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sh-top .ring{border-radius:50%;border:4px solid var(--panel);display:inline-flex;box-shadow:var(--shadow-sm)}
.sh-name{font-size:20px;font-weight:650;margin-top:10px;display:flex;align-items:center;gap:6px}
.sh-sub{font-size:13px;color:var(--muted)}
.sh-stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin:16px 0 4px}
.sh-stats div{padding:10px 0;text-align:center;border-left:1px solid var(--line2)}
.sh-stats div:first-child{border-left:0}
.sh-stats b{display:block;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.sh-stats span{font-size:11.5px;color:var(--muted)}
.sh-h{font-size:12.5px;color:var(--faint);margin:18px 0 8px;font-weight:500}
.sh-quote{font-size:14px;line-height:1.7;color:var(--text2)}
.skl{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.skl:first-of-type{border-top:0}
.skl em{font-style:normal;font-size:12px;color:var(--muted);margin-right:8px}
.heat{display:grid;grid-template-columns:36px repeat(7,1fr);gap:4px;font-size:11px;color:var(--faint);text-align:center;align-items:center}
.heat i{height:22px;border-radius:5px;background:var(--soft)}
.heat i.them{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.heat i.both{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rv{padding:12px 0;border-top:1px solid var(--line2);display:flex;gap:10px}
.rv:first-of-type{border-top:0}
.rv .rh{font-size:13px;display:flex;align-items:center;gap:6px}
.rv .rh .st5{color:var(--gold);display:inline-flex}
.rv .rh .st5 svg{width:12px;height:12px}
.rv p{margin:3px 0 0;font-size:13.5px;color:var(--text2)}
.sh-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px}
.sh-foot .btn{flex:1;padding:10px 14px}
.dialog{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:rgba(9,9,11,.5);opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.dialog.show{opacity:1;pointer-events:auto}
.dialog .dbox{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:22px;transform:scale(.96);transition:transform .2s var(--ease);color:var(--text)}
.dialog.show .dbox{transform:none}
.dialog h3{margin:0 0 6px;font-size:17px}
.dialog p{margin:0 0 18px;color:var(--muted);font-size:14px}
.dialog .da{display:flex;justify-content:flex-end;gap:8px}
.cmdk{position:fixed;inset:0;z-index:85;background:rgba(9,9,11,.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;opacity:0;pointer-events:none;transition:opacity .15s}
.cmdk.show{opacity:1;pointer-events:auto}
.cmdk .box{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;transform:scale(.98) translateY(-6px);transition:transform .18s var(--ease)}
.cmdk.show .box{transform:none}
.cmdk .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk .in svg{color:var(--faint)}
.cmdk input{flex:1;border:0;outline:0;background:none;font-size:16px}
.cmdk .lst{max-height:min(380px,52vh);overflow-y:auto;padding:6px}
.cmdk .gl{font-size:11.5px;color:var(--faint);padding:8px 10px 4px;font-weight:500}
.cmdk .ci{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text2)}
.cmdk .ci .ico{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none;background:var(--panel)}
.cmdk .ci .ico svg{width:15px;height:15px}
.cmdk .ci small{color:var(--faint);font-size:12px;margin-left:6px}
.cmdk .ci kbd{margin-left:auto}
.cmdk .ci.sel{background:var(--soft);color:var(--text)}
.cmdk .none{padding:28px;text-align:center;color:var(--muted);font-size:14px}
.cmdk .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.cmdk .ft span{display:inline-flex;align-items:center;gap:5px}

/* ---------- notif / toast ---------- */
.notif{position:fixed;top:16px;right:16px;z-index:70;width:min(380px,calc(100vw - 24px));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:14px;display:flex;gap:12px;transform:translateY(-12px) scale(.98);opacity:0;pointer-events:none;transition:.35s var(--ease)}
.notif.show{transform:none;opacity:1;pointer-events:auto}
.notif .orb{width:34px;height:34px}
.notif .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.5}
.notif .tx b{display:block;font-size:14px}
.notif .tx span{color:var(--muted);font-variant-numeric:tabular-nums}
.notif .acts{display:flex;gap:8px;margin-top:10px}
.notif .x{border:0;background:none;color:var(--faint);height:24px;width:24px;display:grid;place-items:center;border-radius:6px}
.notif .x:hover{background:var(--hover)}
.toaster{position:fixed;left:50%;top:16px;width:min(380px,calc(100vw - 24px));transform:translateX(-50%);z-index:80;margin:0;padding:0;list-style:none;height:0}
.tst{position:absolute;left:0;top:0;width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:11px 14px;font-size:13.5px;transform:translateY(-120%);opacity:0;transition:transform .4s var(--ease),opacity .4s;transform-origin:top center;--y:0px;--s:1}
.tst::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:10px}
.tst[data-m]{transform:translateY(var(--y)) scale(var(--s));opacity:var(--o,1)}
.tst[data-r]{transform:translateY(calc(var(--y) - 40%)) scale(var(--s));opacity:0}
.tst .ti{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--teach);color:#fff}
.tst .ti svg{width:12px;height:12px;stroke-width:3}
.tst .ti.info{background:var(--accent)}
.tst .ti.warn{background:var(--gold)}

/* ---------- classroom ---------- */
.room{position:fixed;inset:0;z-index:60;background:#0b0b0d;color:#f4f4f5;display:none;flex-direction:column}
.room.show{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.room-top{display:flex;align-items:center;gap:14px;padding:14px 22px 12px;flex-wrap:wrap;position:relative}
.room-top .ttl{font-weight:600;font-size:15px}
.room-top .ttl small{display:block;font-weight:400;color:#a1a1aa;font-size:12px}
.rprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.rprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#ff7ab6);transition:width 1s linear}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#fca5a5;background:rgba(239,68,68,.12);padding:3px 10px;border-radius:999px}
.rec::before{content:'';width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink 1.4s infinite}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.07);padding:5px 12px;border-radius:999px;font-size:13px}
.room-body{flex:1;display:grid;grid-template-columns:1fr 340px;gap:14px;padding:12px 14px 0;min-height:0}
.stage{position:relative;display:flex;min-height:0}
.tile{flex:1;border-radius:20px;background:#141417;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.blobs{position:absolute;inset:-20%;filter:blur(60px);opacity:.55}
.blobs i{position:absolute;width:45%;height:55%;border-radius:50%;animation:drift 14s ease-in-out infinite alternate}
.blobs i:nth-child(2){animation-duration:18s;animation-delay:-4s}
.blobs i:nth-child(3){animation-duration:22s;animation-delay:-9s}
@keyframes drift{0%{transform:translate(10%,10%) scale(1)}50%{transform:translate(80%,40%) scale(1.2)}100%{transform:translate(30%,90%) scale(.9)}}
.tile .nm{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:4px 10px;border-radius:8px;font-size:12.5px;display:flex;align-items:center;gap:6px;z-index:2}
.tile .nm svg{width:13px;height:13px}
.bars{display:inline-flex;gap:2px;align-items:center;height:12px}
.bars i{width:3px;border-radius:2px;background:#4ade80;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:12px;animation-delay:.15s}.bars i:nth-child(3){height:8px;animation-delay:.3s}
@keyframes eq{50%{transform:scaleY(.35)}}
.talk{border-radius:50%;padding:5px;animation:talk 1.8s infinite;position:relative;z-index:1}
@keyframes talk{0%,100%{box-shadow:0 0 0 0 rgba(157,140,255,0)}50%{box-shadow:0 0 0 14px rgba(157,140,255,.2)}}
.tile.me{position:absolute;right:18px;bottom:18px;width:212px;height:136px;flex:none;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.45);background:#1c1c20;z-index:3}
.tile.me video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.caption{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.62);backdrop-filter:blur(8px);padding:8px 16px;border-radius:12px;font-size:14.5px;max-width:58%;text-align:center;z-index:2;line-height:1.55}
.caption b{color:#c4b5fd;font-weight:600}
.offline-card{text-align:center;max-width:380px;padding:0 20px;position:relative;z-index:1}
.offline-card .pinb{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin:0 auto 14px}
.offline-card .pinb svg{width:24px;height:24px}
.notes{border-radius:20px;background:#141417;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;min-height:0}
.notes-h{padding:16px 18px 10px}
.notes h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.notes h4 .orb{width:20px;height:20px}
.notes h4 .live{margin-left:auto;font-size:11px;font-weight:500;color:#4ade80;display:inline-flex;align-items:center;gap:5px}
.notes h4 .live::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.4s infinite}
.notes .nsub{font-size:12px;color:#a1a1aa;margin-top:4px}
.nbox{flex:1;overflow-y:auto;padding:4px 14px}
.note{font-size:13.5px;padding:9px 12px;border-radius:12px;margin-bottom:6px;animation:rise .3s;line-height:1.55;display:flex;gap:8px}
.note.ai{color:#a1a1aa}
.note.ai svg{width:14px;height:14px;color:#a78bfa;margin-top:3px;flex:none}
.note.mine{color:#fafafa;background:rgba(255,255,255,.06)}
.note.mine b{font-size:10.5px;background:rgba(255,255,255,.12);border-radius:5px;padding:0 5px;height:18px;line-height:18px;margin-top:1px;flex:none}
.note small{display:block;color:#71717a;font-size:11px}
.nin{margin:10px 14px 14px;display:flex;gap:8px;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px 6px 6px 12px;background:rgba(255,255,255,.03)}
.nin input{flex:1;border:0;outline:0;background:none;color:#fff;font-size:13.5px;min-width:0}
.nin input::placeholder{color:#71717a}
.nin button{border:0;background:#fafafa;color:#18181b;border-radius:8px;width:28px;height:28px;display:grid;place-items:center}
.nin button svg{width:14px;height:14px;stroke-width:2.2}
.room-ctl{display:flex;justify-content:center;gap:12px;padding:16px}
.rbtn{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;transition:background .15s,transform .1s;position:relative}
.rbtn:hover{background:rgba(255,255,255,.16)}
.rbtn:active{transform:scale(.94)}
.rbtn.off{background:#fafafa;color:#18181b}
.rbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:58px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#27272a;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px}
.rbtn.end{background:#ef4444;width:auto;padding:0 22px;border-radius:999px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.rbtn.end:hover{background:#dc2626}

/* ---------- A2UI inspector (?a2ui) ---------- */
.insp{position:fixed;right:0;top:0;bottom:0;width:420px;background:#0b0b0d;color:#d4d4d8;z-index:90;display:none;flex-direction:column;font:12px/1.45 ui-monospace,Menlo,monospace;border-left:1px solid #27272a}
.insp.show{display:flex}
.insp h4{margin:0;padding:10px 12px;border-bottom:1px solid #27272a;font:600 13px -apple-system,sans-serif;color:#fff;display:flex;justify-content:space-between}
.insp .lg{flex:1;overflow:auto;padding:8px 12px}
.insp pre{margin:0 0 10px;white-space:pre-wrap;word-break:break-all;border-left:3px solid #7c5cff;padding-left:8px}
.insp pre.up{border-color:#34d399}

/* ---------- responsive ---------- */
@media (max-width:1100px){.room-body{grid-template-columns:1fr 290px}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:286px;z-index:50;transform:translateX(-102%);transition:transform .3s var(--ease);box-shadow:var(--shadow-lg)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;animation:fadein .2s}
  .menu{display:grid}
  .head{padding:0 12px;gap:8px;height:54px}
  .hbtn .lb{display:none}
  .hbtn{padding:6px 10px}
  .stream-col{padding:18px 16px 12px;gap:18px}
  .dock{padding:0 12px 8px}
  .bubble{max-width:86%}
  .carousel{margin:0 -16px}
  .a2-list.h{padding:4px 16px 14px;scroll-padding:0 16px}
  .car-item{flex-basis:82%}
  .car-nav{display:none}
  .hero h1{font-size:22px}
  .topbar{display:flex;align-items:center;gap:8px;height:54px;padding:0 12px;border-bottom:1px solid var(--line2);font-weight:600;flex:none}
  .page-in{padding:18px 16px 32px}
  .page h1{font-size:21px}
  .grid2{grid-template-columns:1fr}
  .ev{grid-template-columns:1fr}
  .rep-grid{grid-template-columns:repeat(2,1fr)}
  .room-body{grid-template-columns:1fr;grid-template-rows:1fr 210px;padding:8px 10px 0}
  .tile.me{width:112px;height:80px;right:12px;bottom:12px}
  .caption{max-width:calc(100% - 40px);font-size:13px;bottom:106px}
  .room-ctl{gap:8px;padding:12px}
  .rbtn{width:44px;height:44px}
  .insp{width:100%}
  .c-hint{display:none}
  .toaster{top:10px}
  .sheet .panel{top:auto;left:0;right:0;bottom:0;width:100%;height:88dvh;border-radius:20px 20px 0 0;transform:translateY(100%)}
  .cmdk{padding-top:10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" data-act="closeDrawer"></div>
  <main class="main" id="main"></main>
</div>
<div class="notif" id="notif" role="status"></div>
<div class="room" id="room"></div>
<div class="sheet" id="sheet"><div class="scrim2" data-act="closeSheet"></div><div class="panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div class="dialog" id="dialog"><div class="dbox" id="dbox" role="alertdialog"></div></div>
<div class="cmdk" id="cmdk"><div class="box" role="dialog" aria-label="命令面板"><div class="in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cmdkIn" placeholder="搜索命令、私聊或课程…" autocomplete="off"><kbd>esc</kbd></div><div class="lst" id="cmdkList"></div><div class="ft"><span><kbd>↑</kbd><kbd>↓</kbd>选择</span><span><kbd>↵</kbd>打开</span><span><kbd>esc</kbd>关闭</span></div></div></div>
<ol class="toaster" id="toaster" aria-live="polite"></ol>
<aside class="insp" id="insp"><h4>A2UI 消息流 <span style="cursor:pointer" onclick="this.closest('.insp').classList.remove('show')">✕</span></h4><div class="lg" id="insplog"></div></aside>

<script>
'use strict';
/* =====================================================================
   基础工具
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>').replace(/\n/g,'<br>');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2,'0');
const WEEK = '日一二三四五六';
const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const uniq = a => [...new Set(a)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
function dayStart(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function dayDiff(ts){ return Math.round((dayStart(ts)-dayStart(Date.now()))/DAY); }
function fmtDay(ts){ const d=new Date(ts), k=dayDiff(ts); return k===0?'今天':k===1?'明天':k===2?'后天':k===-1?'昨天':`${d.getMonth()+1}月${d.getDate()}日 周${WEEK[d.getDay()]}`; }

const TOASTS=[]; let toastHover=false;
function toast(msg,{icon='check',tone=''}={}){
  const el=document.createElement('li'); el.className='tst'; el.innerHTML=`<span class="ti ${tone}">${I(icon)}</span><span>${esc(msg)}</span>`;
  $('#toaster').appendChild(el);
  const t={el,remain:4000,start:0,timer:null}; TOASTS.unshift(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.dataset.m='1'; layoutToasts(); }));
  if(!toastHover) armToast(t);
  while(TOASTS.length>4) dropToast(TOASTS[TOASTS.length-1]);
  layoutToasts();
}
function armToast(t){ clearTimeout(t.timer); t.start=Date.now(); t.timer=setTimeout(()=>dropToast(t),t.remain); }
function dropToast(t){ const i=TOASTS.indexOf(t); if(i<0) return; TOASTS.splice(i,1); clearTimeout(t.timer); t.el.dataset.r='1'; setTimeout(()=>t.el.remove(),400); layoutToasts(); }
function layoutToasts(){
  const sign=1; let acc=0;
  TOASTS.forEach((t,i)=>{ const h=t.el.offsetHeight||48; let y,s; if(toastHover){ y=sign*acc; s=1; acc+=h+8; } else { y=sign*i*12; s=1-.05*i; }
    t.el.style.setProperty('--y',y+'px'); t.el.style.setProperty('--s',s); t.el.style.setProperty('--o',(!toastHover&&i>2)?0:1); t.el.style.zIndex=20-i; });
}
$('#toaster').addEventListener('mouseenter',()=>{ toastHover=true; TOASTS.forEach(t=>{ clearTimeout(t.timer); t.remain=Math.max(800,t.remain-(Date.now()-t.start)); }); layoutToasts(); });
$('#toaster').addEventListener('mouseleave',()=>{ toastHover=false; TOASTS.forEach(armToast); layoutToasts(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) TOASTS.forEach(t=>{ clearTimeout(t.timer); t.remain=Math.max(800,t.remain-(Date.now()-t.start)); }); else if(!toastHover) TOASTS.forEach(armToast); });

const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
function skillMatch(a,b){ a=norm(a); b=norm(b); return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a)); }
const tRank=l=>TEACH_LV.indexOf(l)+1;
const lRank=l=>Math.max(0,LEARN_LV.indexOf(l));
function commonModes(u,P){ let m=P.mode==='都可以'?u.modes.slice():u.modes.filter(x=>x===P.mode); if(u.city!==P.city) m=m.filter(x=>x!=='线下'); return m; }
function matchInfo(u,P=state.profile){
  const theyTeach=[],iTeach=[];
  u.teach.forEach(t=>P.learn.forEach(l=>{ if(skillMatch(t.skill,l.skill)&&tRank(t.level)>lRank(l.level)&&!theyTeach.some(x=>x.skill===t.skill)) theyTeach.push({skill:t.skill,level:t.level,myLevel:l.level}); }));
  P.teach.forEach(t=>u.learn.forEach(l=>{ if(skillMatch(t.skill,l.skill)&&tRank(t.level)>lRank(l.level)&&!iTeach.some(x=>x.skill===t.skill)) iTeach.push({skill:t.skill,level:t.level,theirLevel:l.level}); }));
  const type=theyTeach.length&&iTeach.length?'both':theyTeach.length?'learn':iTeach.length?'teach':'none';
  if(type==='none') return {type};
  const avail=u.avail.filter(a=>P.avail.includes(a)); const modes=commonModes(u,P);
  let score={both:58,learn:38,teach:30}[type];
  score+=avail.length?6:0; score+=modes.length?5:-15; score+=(modes.includes('线下')?6:0);
  score+=Math.round((u.rating-4)*15)+(u.verified?3:0)+(theyTeach[0]&&tRank(theyTeach[0].level)>=3?2:0);
  score=Math.max(12,Math.min(99,score));
  const t=theyTeach[0],i=iTeach[0];
  let reason=type==='both'?`${t.level}${t.skill}，又正好想学你的${i.skill}，可以直接互换，谁都不用花时间币。`:type==='learn'?`${t.level}${t.skill}。${u.style.replace(/^我/,'TA ')}`:`正想学${i.skill}（现在${i.theirLevel}），你来教每课时赚 1 时间币，攒着去学${P.learn[0]?P.learn[0].skill:'想学的技能'}。`;
  if(avail.length) reason+=`你们都在${avail.join('、')}有空`+(modes.includes('线下')?`，还都在${u.city}，可以线下见面。`:'。');
  return {type,theyTeach,iTeach,score,reason,avail,modes};
}

function parseSkills(text){
  let t=' '+String(text||'').toLowerCase()+' '; const found=[];
  const pairs=[]; Object.entries(ALIASES).forEach(([k,arr])=>arr.forEach(a=>pairs.push([k,a])));
  pairs.sort((a,b)=>b[1].length-a[1].length);
  pairs.forEach(([k,a])=>{ const re=/^[a-z]+$/.test(a)?new RegExp('(^|[^a-z])'+a+'([^a-z]|$)'):null; if(re?re.test(t):t.includes(a)){ if(!found.includes(k)) found.push(k); t=t.split(a).join(' '); } });
  if(!found.length) String(text||'').replace(/我(会|能|可以)?(教|学)?|想学|擅长|还有|以及|一些|吧|呢|啊|的/g,' ').split(/[,，、。;；\s和及跟与]+/).map(x=>x.trim()).filter(x=>x.length>=2&&x.length<=10).forEach(x=>found.push(x));
  return uniq(found);
}

function slotFromAvail(a,after=Date.now()){ const [days,h]=SLOT_DEF[a]||SLOT_DEF['周末下午']; for(let i=0;i<15;i++){ const c=new Date(after); c.setDate(c.getDate()+i); c.setHours(h,0,0,0); if(days.includes(c.getDay())&&c.getTime()>after+2*HOUR) return c.getTime(); } return after+DAY; }

const slotOpt=(ts,note)=>{ const d=new Date(ts); const k=dayDiff(ts); return {value:String(ts),dow:k===0?'今天':k===1?'明天':'周'+WEEK[d.getDay()],date:`${d.getMonth()+1}/${d.getDate()}`,time:fmtHM(ts),...(note?{note}:{})}; };

function scoreCmd(x,q){ const t=norm(x.t),k=norm(x.k||''); if(t.startsWith(q)) return 3; if(t.includes(q)) return 2; if(k.includes(q)) return 1; let i=0; for(const c of t) if(c===q[i]&&++i===q.length) return .5; return 0; }
function renderCmdk(q){

  let res=q?all.map(x=>({x,s:scoreCmd(x,q)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.x):all;
  CMDK.items=res; if(CMDK.sel>=res.length) CMDK.sel=0;

  let html='', g=null;
  res.forEach((x,i)=>{ const grp=q&&i===0?'最佳匹配':x.g; if(grp!==g){ html+=`<div class="gl">${grp}</div>`; g=grp; }
    html+=`<div class="ci${i===CMDK.sel?' sel':''}" data-ci="${i}"><span class="ico">${x.av?avatarHTML(x.av,22):I(x.i)}</span><span>${esc(x.t)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span>${x.sc?`<kbd>${x.sc}</kbd>`:''}</div>`; });
