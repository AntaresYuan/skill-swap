<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>技能换换 · AI 技能交换</title>
<meta name="description" content="用你会的，换你想学的。AI 顾问小换帮你建立技能档案、匹配交换伙伴、约课并提醒上课。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235b5bd6'/><stop offset='1' stop-color='%23d65b9a'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><path d='M18 26h22l-6-6M46 38H24l6 6' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f4f5f9;--panel:#fff;--text:#1d2130;--muted:#6b7280;--line:#e6e8ef;--soft:#f1f2f7;
  --pri:#5b5bd6;--pri-d:#4848c2;--pri-50:#eef0ff;
  --teach:#0e9467;--teach-50:#e6f6ef;--learn:#e2570c;--learn-50:#fff0e6;
  --gold:#f2a516;--red:#e5484d;
  --ai:linear-gradient(135deg,#5b5bd6 0%,#9b5bd6 55%,#d65b9a 100%);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111219;--panel:#1a1c25;--text:#e9eaf0;--muted:#9aa0ae;--line:#2a2d3a;--soft:#232634;
  --pri:#7c7cf0;--pri-d:#9393ff;--pri-50:#262850;--teach:#34c08f;--teach-50:#15372b;--learn:#ff8a4c;--learn-50:#3b2415;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:76px 300px 1fr;height:100vh;height:100dvh}
.app.nolist{grid-template-columns:76px 1fr}
.app.nolist .list{display:none}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;gap:6px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--ai);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:14px}
.rail .nb{width:62px;border:0;background:none;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);position:relative}
.rail .nb .ic{font-size:21px;line-height:1.2}
.rail .nb:hover{background:var(--soft)}
.rail .nb.on{background:var(--pri-50);color:var(--pri);font-weight:600}
.rail .sp{flex:1}
.dot{position:absolute;top:3px;right:9px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;line-height:1}
.coinv{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#a15c00;background:#fff6e0;border:1px solid #fde3ad;border-radius:12px;padding:6px 8px;margin-bottom:8px;line-height:1.3;cursor:pointer}
.coinv b{font-size:16px}
@media (prefers-color-scheme:dark){.coinv{background:#3a2c10;color:#ffc65c;border-color:#5a4417}}

.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
.list-h{padding:20px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.list-h h2{margin:0;font-size:19px}
.citems{overflow-y:auto;flex:1;padding:0 8px 12px}
.citem{display:flex;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;align-items:center}
.citem:hover{background:var(--soft)}
.citem.on{background:var(--pri-50)}
.citem .bd{flex:1;min-width:0}
.citem .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:14px}
.citem .nm small{font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap}
.citem .pv{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;display:flex;justify-content:space-between;gap:8px}
.citem .pv span{overflow:hidden;text-overflow:ellipsis}
.citem .ub{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center}
.pin{font-size:10px;color:var(--pri);background:var(--pri-50);padding:0 6px;border-radius:4px;margin-left:6px;font-weight:600}
.list-tip{margin:8px 10px;padding:12px;border-radius:12px;background:var(--soft);font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1}
.bot{background:var(--ai)!important}

/* ---------- chat ---------- */
.chat-head{height:66px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-head .t{font-weight:600;display:flex;align-items:center;gap:6px}
.chat-head .s{font-size:12px;color:var(--muted)}
.chat-head .r{margin-left:auto;display:flex;gap:8px}
.online{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.back{display:none;border:0;background:none;font-size:28px;line-height:1;padding:0 4px 4px 0;color:var(--text)}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.hbtn.ai{border:0;background:var(--ai);color:#fff}
.hbtn.ai:hover{filter:brightness(1.08)}
.msgs{flex:1;overflow-y:auto;padding:22px 20px 10px;scroll-behavior:smooth}
.msgs-inner{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:10px;align-items:flex-start;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.me{flex-direction:row-reverse}
.m .col{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1;align-items:flex-start}
.m.me .col{align-items:flex-end}
.bub{padding:10px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);max-width:min(600px,86%);word-break:break-word;box-shadow:var(--shadow)}
.m.ai .bub,.m.peer .bub{border-top-left-radius:6px}
.m.me .bub{background:var(--pri);color:#fff;border-color:transparent;border-top-right-radius:6px;box-shadow:none}
.bub.aiin{background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--ai) border-box;border:1.5px solid transparent}
.who{font-size:12px;color:var(--muted);margin-bottom:-4px}
.who b{background:var(--ai);-webkit-background-clip:text;background-clip:text;color:transparent}
.m.sys{justify-content:center}
.m.sys .pill{font-size:12px;color:var(--muted);background:var(--soft);padding:4px 12px;border-radius:999px;text-align:center}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:8px 20px 0;max-width:840px;margin:0 auto;width:100%;scrollbar-width:none}
.suggest:empty{display:none}
.suggest button{flex:none;border:1px solid color-mix(in srgb,var(--pri) 45%,transparent);color:var(--pri);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.suggest button:hover{background:var(--pri-50)}
.composer{padding:10px 20px 16px;flex:none}
.composer .box{max-width:800px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.composer .box:focus-within{border-color:var(--pri)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;max-height:140px;padding:7px 0;line-height:1.5}
.send{border:0;background:var(--pri);color:#fff;border-radius:11px;padding:8px 16px;font-weight:600}
.send:hover{background:var(--pri-d)}
.bub a{color:inherit;text-decoration:underline;word-break:break-all}

/* ---------- A2UI renderer ---------- */
.a2ui{width:100%;max-width:640px}
.a2ui:has(.a2-list){max-width:820px}
.a2-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.a2-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.a2-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.a2-row.between{justify-content:space-between;flex-wrap:nowrap}
.a2-row .a2-row{flex-wrap:nowrap}
.a2-row .a2-col{gap:0}
.a2-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;width:100%}
.a2-list.v{grid-template-columns:1fr}
.a2-list>.a2-card{display:flex;flex-direction:column}
.a2-list>.a2-card>.a2-col{flex:1}
.a2-list>.a2-card>.a2-col>.a2-btn:last-child{margin-top:auto}
.a2-hr{border:0;border-top:1px dashed var(--line);margin:2px 0;width:100%}
.t-h3{font-size:18px;font-weight:700;line-height:1.35}
.t-h4{font-size:16px;font-weight:700;line-height:1.35}
.t-h5{font-size:14.5px;font-weight:600;line-height:1.35}
.t-caption{font-size:12.5px;color:var(--muted);line-height:1.55}
.t-body{font-size:14px;line-height:1.6}
.a2-chips{display:flex;flex-wrap:wrap;gap:7px}
.a2-chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;font-size:13.5px;transition:.12s}
.a2-chip:hover{border-color:var(--pri);color:var(--pri)}
.a2-chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.a2-field{display:grid;gap:5px;width:100%}
.a2-field>span{font-size:12.5px;color:var(--muted)}
.a2-input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);outline:0;width:100%}
.a2-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-50)}
.a2-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;font-weight:600;font-size:14px;transition:.12s}
.a2-btn:hover{border-color:var(--pri);color:var(--pri)}
.a2-btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.a2-btn.pri:hover{background:var(--pri-d);color:#fff}
.a2-list .a2-btn{width:100%}
.a2-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--soft);white-space:nowrap}
.a2-tag em{font-style:normal;font-size:11px;opacity:.8}
.a2-tag.teach{background:var(--teach-50);color:var(--teach)}
.a2-tag.learn{background:var(--learn-50);color:var(--learn)}
.a2-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--soft);color:var(--muted);white-space:nowrap;align-self:flex-start}
.a2-badge.pri{background:var(--pri-50);color:var(--pri)}
.a2-badge.teach{background:var(--teach-50);color:var(--teach)}
.a2-badge.learn{background:var(--learn-50);color:var(--learn)}
.a2-badge.score{background:var(--ai);color:#fff;font-size:13px;padding:3px 10px;align-self:center}
.a2-badge.soft{font-weight:500}
.a2-rating{display:flex;gap:4px}
.a2-rating button{border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:0 2px}
.a2-rating button.on{color:var(--gold)}
.a2ui.locked .a2-chip,.a2ui.locked .a2-input,.a2ui.locked .a2-rating{pointer-events:none}
.a2ui.locked .a2-chip:not(.on){opacity:.45}
.a2ui.locked .a2-btn:not(.chosen){display:none}
.a2ui.locked .a2-btn.chosen{pointer-events:none;background:var(--soft);border-color:var(--line);color:var(--muted)}
.a2ui.locked .a2-btn.chosen::before{content:'✓ '}

/* ---------- calendar & me ---------- */
.page{flex:1;overflow-y:auto;padding:26px 28px 40px}
.page-in{max-width:900px;margin:0 auto}
.page h1{font-size:24px;margin:0 0 4px}
.page .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:thin}
.day{flex:none;width:58px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 0;text-align:center;position:relative}
.day small{display:block;font-size:11px;color:var(--muted)}
.day b{font-size:18px}
.day.today{border-color:var(--pri)}
.day.on{background:var(--pri);border-color:var(--pri);color:#fff}
.day.on small{color:#fff}
.day i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--learn)}
.sech{font-size:14px;font-weight:600;color:var(--muted);margin:22px 0 10px}
.ev{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px}
.ev .tm{border-right:1px dashed var(--line);padding-right:12px}
.ev .tm b{font-size:20px;display:block;line-height:1.2}
.ev .tm small{font-size:12px;color:var(--muted)}
.ev .ti{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .meta{font-size:13px;color:var(--muted);margin:6px 0 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ev .meta a{word-break:break-all}
.ev .acts{display:flex;gap:8px;flex-wrap:wrap}
.st{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.st.up{background:var(--pri-50);color:var(--pri)}
.st.live{background:#ffe9e9;color:var(--red)}
.st.done{background:var(--teach-50);color:var(--teach)}
@media (prefers-color-scheme:dark){.st.live{background:#3d1c1e}}
.sync{font-size:12px;color:var(--teach)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);color:#fff}
.btn.ai{background:var(--ai);border:0;color:#fff}
.btn.ai:hover{color:#fff;filter:brightness(1.08)}
.empty{text-align:center;padding:56px 20px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;font-size:42px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.kv{font-size:13px;color:var(--muted);margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat b{font-size:22px;display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.ledger div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.plus{color:var(--teach);font-weight:600}.minus{color:var(--learn);font-weight:600}.zero{color:var(--muted)}
.rules{font-size:13px;color:var(--muted);display:grid;gap:4px;margin-bottom:10px}

/* ---------- banner / toast ---------- */
.banner{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);transition:.35s cubic-bezier(.2,.9,.3,1.2);z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px 14px;display:flex;align-items:center;gap:12px;width:min(520px,calc(100vw - 24px))}
.banner:not(.show){opacity:0;pointer-events:none}
.banner.show{transform:translate(-50%,0);opacity:1}
.banner .tx{flex:1;font-size:14px;min-width:0}
.banner .tx small{display:block;color:var(--muted);font-size:12px}
.banner .x{border:0;background:none;color:var(--muted);font-size:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1d2130;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- classroom ---------- */
.room{position:fixed;inset:0;z-index:60;background:#0d0e14;color:#fff;display:none;flex-direction:column}
.room.show{display:flex}
.room-top{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.room-top .ttl{font-weight:600}
.room-top .ttl small{display:block;font-weight:400;color:#9aa0ae;font-size:12px}
.room-top .clock{margin-left:auto;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:999px;font-size:14px}
.rec{color:#ff6b6b;font-size:13px}
.room-body{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
.stage{position:relative;padding:18px;display:flex;min-height:0}
.tile{flex:1;border-radius:18px;background:radial-gradient(circle at 50% 40%,#2c2f45,#16171f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden}
.tile .nm{position:absolute;left:14px;bottom:12px;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:8px;font-size:13px}
.tile .ring{border-radius:50%;padding:6px;animation:talk 1.6s infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 0 rgba(124,124,240,0)}50%{box-shadow:0 0 0 10px rgba(124,124,240,.35)}}
.tile.me{position:absolute;right:30px;bottom:30px;width:180px;height:120px;flex:none;border:2px solid rgba(255,255,255,.15)}
.tile.me.off{background:#222}
.tile.me.off .av{opacity:.3}
.caption{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:10px;font-size:14px;max-width:70%;text-align:center}
.offline-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px 24px;text-align:center;max-width:420px;margin:0 16px}
.notes{border-left:1px solid rgba(255,255,255,.08);padding:18px;overflow-y:auto;background:#12131b}
.notes h4{margin:0 0 4px;font-size:15px}
.notes .nsub{font-size:12px;color:#9aa0ae;margin-bottom:12px}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:8px;animation:pop .3s}
.note small{display:block;color:#9aa0ae;font-size:11px}
.room-ctl{display:flex;justify-content:center;gap:12px;padding:14px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.room-ctl button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;min-width:64px}
.room-ctl button.off{background:#3b1d22;color:#ff8f8f}
.room-ctl .end{background:var(--red);font-weight:600;padding:10px 22px}

/* ---------- A2UI inspector (?a2ui) ---------- */
.insp{position:fixed;right:0;top:0;bottom:0;width:420px;background:#0f1117;color:#c9d1d9;z-index:90;display:none;flex-direction:column;font:12px/1.45 ui-monospace,Menlo,monospace;border-left:1px solid #222}
.insp.show{display:flex}
.insp h4{margin:0;padding:10px 12px;border-bottom:1px solid #222;font:600 13px -apple-system,sans-serif;color:#fff;display:flex;justify-content:space-between}
.insp .lg{flex:1;overflow:auto;padding:8px 12px}

function getPath(o,p){ return String(p).split('/').filter(Boolean).reduce((a,k)=>a==null?undefined:a[k], o); }

function toContents(o){ return Object.entries(o).map(([key,v])=> Array.isArray(v)?{key,valueList:v.map(x=>({valueString:String(x)}))} : typeof v==='number'?{key,valueNumber:v} : typeof v==='boolean'?{key,valueBoolean:v} : (v&&typeof v==='object')?{key,valueMap:toContents(v)} : {key,valueString:String(v??'')}); }
function fromVal(e){ if('valueString' in e) return e.valueString; if('valueNumber' in e) return e.valueNumber; if('valueBoolean' in e) return e.valueBoolean; if('valueMap' in e) return fromContents(e.valueMap); if('valueList' in e) return e.valueList.map(fromVal); }
function fromContents(c){ const o={}; (c||[]).forEach(e=>o[e.key]=fromVal(e)); return o; }

function a2uiReceive(msg){
  a2uiLog('down', msg);
  if(msg.surfaceUpdate){ const {surfaceId,components}=msg.surfaceUpdate; const s=state.surfaces[surfaceId]||(state.surfaces[surfaceId]={components:{},data:{},root:null,locked:false,chosen:null}); components.forEach(c=>s.components[c.id]=c.component); }
  else if(msg.dataModelUpdate){ const {surfaceId,path,contents}=msg.dataModelUpdate; const s=state.surfaces[surfaceId]; if(s) setPath(s.data, path||'/', fromContents(contents)); }
  else if(msg.beginRendering){ const s=state.surfaces[msg.beginRendering.surfaceId]; if(s) s.root=msg.beginRendering.root; }
  else if(msg.deleteSurface){ delete state.surfaces[msg.deleteSurface.surfaceId]; }
}

// Agent 端组件构建（标准组件 + 客户端扩展目录 Avatar / Tag / Badge / Rating）
let B = null;
function comp(type, props){ const id='c'+(++B.n); B.list.push({id, component:{[type]:props}}); return id; }
const L = s => ({literalString:String(s)});
const kids = a => ({explicitList:a.filter(Boolean)});
const UI = {
  text:(t,hint='body')=>comp('Text',{text:L(t),usageHint:hint}),
  label:t=>UI.text(t,'caption'),
  row:(a,o={})=>comp('Row',{children:kids(a),alignment:'center',distribution:o.between?'spaceBetween':'start'}),
  col:a=>comp('Column',{children:kids(a)}),
  list:(a,dir='horizontal')=>comp('List',{children:kids(a),direction:dir}),
  card:child=>comp('Card',{child}),
  divider:()=>comp('Divider',{}),
  button:(label,name,ctx={},primary=false)=>comp('Button',{child:UI.text(label),primary,action:{name,context:Object.entries(ctx).map(([key,v])=>({key,value:L(v)}))}}),
  choice:(path,opts,max=1)=>comp('MultipleChoice',{selections:{path},options:opts.map(o=>({label:L(o.label??o),value:String(o.value??o)})),maxAllowedSelections:max}),
  field:(label,path,ph='')=>comp('TextField',{label:L(label),text:{path},textFieldType:'shortText',placeholder:ph}),
  avatar:(u,size=40)=>comp('Avatar',{name:L(u.name),seed:L(u.id),size}),
  tag:(t,tone,level)=>comp('Tag',{text:L(t),tone,...(level?{level:L(level)}:{})}),
  badge:(t,tone='soft')=>comp('Badge',{text:L(t),tone}),
  rating:path=>comp('Rating',{value:{path},max:5})
};
function buildSurface(fn, data={}){
  B={n:0,list:[]}; const root=fn(UI); const list=B.list; B=null;
  const sid='sf'+(++state.seq)+'_'+Math.random().toString(36).slice(2,6);
  [{surfaceUpdate:{surfaceId:sid,components:list}},{dataModelUpdate:{surfaceId:sid,path:'/',contents:toContents(data)}},{beginRendering:{surfaceId:sid,root}}].forEach(a2uiReceive);
  return sid;
}

// 客户端渲染器
function bval(s,v){ if(v==null) return ''; if('literalString' in v) return v.literalString; if('literalNumber' in v) return v.literalNumber; if('literalBoolean' in v) return v.literalBoolean; if('path' in v) return getPath(s.data,v.path); return ''; }
function surfHTML(sid){ const s=state.surfaces[sid]; if(!s||!s.root) return ''; return `<div class="a2ui${s.locked?' locked':''}" data-sid="${sid}">${compHTML(s,s.root)}</div>`; }
function compHTML(s,id){
  const c=s.components[id]; if(!c) return '';
  const [type,p]=Object.entries(c)[0];
  const ch=()=>(p.children&&p.children.explicitList||[]).map(k=>compHTML(s,k)).join('');
  switch(type){
    case 'Text': return `<div class="t-${p.usageHint||'body'}">${md(bval(s,p.text))}</div>`;
    case 'Row': return `<div class="a2-row${p.distribution==='spaceBetween'?' between':''}">${ch()}</div>`;
    case 'Column': return `<div class="a2-col">${ch()}</div>`;
    case 'List': return `<div class="a2-list${p.direction==='vertical'?' v':''}">${ch()}</div>`;
    case 'Card': return `<div class="a2-card">${compHTML(s,p.child)}</div>`;
    case 'Divider': return '<hr class="a2-hr">';
    case 'Button': { const t=s.components[p.child]; const label=t&&t.Text?bval(s,t.Text.text):''; return `<button class="a2-btn${p.primary?' pri':''}${s.chosen===id?' chosen':''}" data-a2btn="${id}">${esc(label)}</button>`; }
    case 'MultipleChoice': { const sel=getPath(s.data,p.selections.path)||[]; return `<div class="a2-chips" data-a2mc="${id}">${p.options.map(o=>`<button class="a2-chip${sel.includes(o.value)?' on':''}" data-v="${esc(o.value)}">${esc(bval(s,o.label))}</button>`).join('')}</div>`; }
    case 'TextField': return `<label class="a2-field">${p.label&&bval(s,p.label)?`<span>${esc(bval(s,p.label))}</span>`:''}<input class="a2-input" data-a2bind="${esc(p.text.path)}" value="${esc(getPath(s.data,p.text.path)??'')}" placeholder="${esc(p.placeholder||'')}"></label>`;
    case 'Avatar': return avatarHTML({id:bval(s,p.seed),name:bval(s,p.name)},p.size||40);
    case 'Tag': return tagHTML(bval(s,p.text),p.tone,p.level?bval(s,p.level):'');
    case 'Badge': return `<span class="a2-badge ${p.tone||''}">${esc(bval(s,p.text))}</span>`;
    case 'Rating': { const v=+getPath(s.data,p.value.path)||0; return `<div class="a2-rating" data-a2rate="${id}">${[1,2,3,4,5].map(n=>`<button class="${n<=v?'on':''}" data-n="${n}">★</button>`).join('')}</div>`; }
  }
  return '';
}
function refreshSurface(sid){ document.querySelectorAll(`.a2ui[data-sid="${sid}"]`).forEach(el=>el.outerHTML=surfHTML(sid)); }
function lockSurface(sid, chosen){ const s=state.surfaces[sid]; if(!s) return; s.locked=true; if(chosen) s.chosen=chosen; save(); refreshSurface(sid); }

function onA2Button(sid,cid){

const COLORS = ['#5b5bd6','#0e9467','#e2570c','#d6409f','#0b7dc1','#8e4ec6','#c2410c','#0d9488'];
function avatarHTML(u,size=40){

function tagHTML(s,tone,level){ return `<span class="a2-tag ${tone||''}">${CAT_ICON[catOf(s)]} ${esc(s)}${level?` <em>${esc(level)}</em>`:''}</span>`; }

const norm = s => String(s).toLowerCase().replace(/\s+/g,'');
function skillMatch(a,b){ a=norm(a); b=norm(b); return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a)); }
const tRank = l => TEACH_LV.indexOf(l)+1;
const lRank = l => Math.max(0,LEARN_LV.indexOf(l));
function commonModes(u,P){ let m=P.mode==='都可以'?u.modes.slice():u.modes.filter(x=>x===P.mode); if(u.city!==P.city) m=m.filter(x=>x!=='线下'); return m; }
function matchInfo(u,P=state.profile){
  const theyTeach=[], iTeach=[];
  u.teach.forEach(t=>P.learn.forEach(l=>{ if(skillMatch(t.skill,l.skill)&&tRank(t.level)>lRank(l.level)&&!theyTeach.some(x=>x.skill===t.skill)) theyTeach.push({skill:t.skill,level:t.level,myLevel:l.level}); }));
  P.teach.forEach(t=>u.learn.forEach(l=>{ if(skillMatch(t.skill,l.skill)&&tRank(t.level)>lRank(l.level)&&!iTeach.some(x=>x.skill===t.skill)) iTeach.push({skill:t.skill,level:t.level,theirLevel:l.level}); }));
  const type=theyTeach.length&&iTeach.length?'both':theyTeach.length?'learn':iTeach.length?'teach':'none';
  if(type==='none') return {type};
  const avail=u.avail.filter(a=>P.avail.includes(a)); const modes=commonModes(u,P);
  let score={both:58,learn:38,teach:30}[type];
  score+=avail.length?6:0; score+=modes.length?5:-15; score+=(modes.includes('线下')?6:0);
  score+=Math.round((u.rating-4)*15)+(u.verified?3:0)+(theyTeach[0]&&tRank(theyTeach[0].level)>=3?2:0);
  score=Math.max(12,Math.min(99,score));
  const t=theyTeach[0], i=iTeach[0];
  let reason = type==='both' ? `${u.name}${t.level}${t.skill}，又正好想学你的${i.skill}，你们可以直接互换，谁都不用花时间币。`
    : type==='learn' ? `${u.name}${t.level}${t.skill}。${u.style.replace(/^我/,'TA ')}`
    : `${u.name}正想学${i.skill}（现在${i.theirLevel}），你来教每课时赚 1 时间币，攒着去学${P.learn[0]?P.learn[0].skill:'想学的技能'}。`;
  if(avail.length) reason+=`你们都在${avail.join('、')}有空`+(modes.includes('线下')?`，还都在${u.city}，可以线下见面。`:'。');
  const tags=[...(modes.length?modes:u.modes).map(m=>m==='线上'?'💻 线上':'📍 线下'), ...(avail.length?avail:u.avail).slice(0,2).map(a=>'📅 '+a)];
  return {type,theyTeach,iTeach,score,reason,tags,avail,modes};
}

function thread(tid){ return state.threads[tid]; }
function visible(tid){ return state.view==='chat' && state.active===tid && !(isMobile()&&state.mlist); }
function push(tid,m){
  const th=thread(tid); m.id=++state.seq; m.at=Date.now(); th.msgs.push(m); th.last=m.at;
  if(m.from!=='me' && m.from!=='sys' && !visible(tid)) th.unread=(th.unread||0)+1;

}
const queues = {};
function enqueue(tid,fn){ queues[tid]=(queues[tid]||Promise.resolve()).then(fn).catch(e=>console.error(e)); return queues[tid]; }
async function showTyping(tid,from,ms){

}
const typeMs = t => Math.min(1500, 450 + String(t||'').length*14);
function say(tid,text,{from='agent',ms}={}){ return enqueue(tid, async()=>{ await showTyping(tid,from,ms??typeMs(text)); push(tid,{from,text}); }); }
function sayUI(tid,text,build,data,{from='agent',ms,after}={}){ return enqueue(tid, async()=>{ await showTyping(tid,from,ms??typeMs(text)+300); const sid=buildSurface(build,data); push(tid,{from,text,sid}); if(after) after(sid); }); }

function parseSkills(text){
  let t=' '+String(text||'').toLowerCase()+' '; const found=[];
  const pairs=[]; Object.entries(ALIASES).forEach(([k,arr])=>arr.forEach(a=>pairs.push([k,a])));
  pairs.sort((a,b)=>b[1].length-a[1].length);
  pairs.forEach(([k,a])=>{ const re=/^[a-z]+$/.test(a)?new RegExp('(^|[^a-z])'+a+'([^a-z]|$)'):null; if(re?re.test(t):t.includes(a)){ if(!found.includes(k)) found.push(k); t=t.split(a).join(' '); } });
  if(!found.length){
    String(text||'').replace(/我(会|能|可以)?(教|学)?|想学|擅长|还有|以及|一些|吧|呢|啊|的/g,' ').split(/[,，、。;；\s和及跟与]+/).map(x=>x.trim()).filter(x=>x.length>=2&&x.length<=10).forEach(x=>found.push(x));
  }
  return uniq(found);
}

function ev0Mode(uid){ const e=state.events.filter(e=>e.uid===uid&&e.status!=='done').sort((a,b)=>a.start-b.start)[0]; return e?e.mode:'线上'; }

/* =====================================================================
   约课：AI 整理 → 双方确认 → 日程

const SLOT_DEF = {'工作日白天':[[1,2,3,4,5],14],'工作日晚上':[[1,2,3,4,5],20],'周末上午':[[6,0],10],'周末下午':[[6,0],15],'周末晚上':[[6,0],19]};
function slotFromAvail(a,after=Date.now()){
  const [days,h]=SLOT_DEF[a]||SLOT_DEF['周末下午'];
  for(let i=0;i<15;i++){ const c=new Date(after); c.setDate(c.getDate()+i); c.setHours(h,0,0,0); if(days.includes(c.getDay())&&c.getTime()>after+2*HOUR) return c.getTime(); }
  return after+DAY;
}
function roomURL(ev){ return location.origin+location.pathname+'#room='+ev.code; }
const BOOK = {
  laterSlot(u){ const P=state.profile; const a=u.avail.find(x=>P.avail.includes(x))||u.avail[0]; return slotFromAvail(a); },
  card(uid,echo=true){

    const soon=ceilMin(Date.now()+3*MIN), later=BOOK.laterSlot(u);

    const opts=[{label:`今天 ${fmtHM(soon)}（待会儿就上）`,value:String(soon)},{label:fmtWhen(later),value:String(later)}];
    if(a2) opts.push({label:fmtWhen(slotFromAvail(a2)),value:String(slotFromAvail(a2))});
    opts.sort((a,b)=>+a.value-+b.value);
    let modes=commonModes(u,P); if(!modes.length) modes=u.modes.filter(m=>m==='线上'); if(!modes.length) modes=['线上'];
    const defMode=th.wantMode&&modes.includes(th.wantMode)?th.wantMode:modes[0];
    const defSlot=th.wantSlot==='later'?String(later):String(soon);
    const pay=PAY[x.type];
    const course = x.type==='both'?`${u.name} 教你 **${x.learn}** ⇄ 你教 ${u.name} **${x.teach}**`:x.type==='learn'?`${u.name} 教你 **${x.learn}**`:`你教 ${u.name} **${x.teach}**`;
    const payT = pay==='swap'?'⇄ 技能互换：课时互相抵扣，双方都不花时间币':pay==='credit'?`⏱ 时间币：每课时 1 币（你的余额 ${state.credits}）`:'📤 你来教：每课时 +1 时间币';
    const bullets=[`• ${u.name}：建议先上 15 分钟试听`];
    if(th.wantMode) bullets.push(`• 你：希望${th.wantMode}上课`);

      ui.text('📋 约课确认单','h4'),

    ])),{slot:[defSlot],mode:[defMode],place:u.place},{ms:1500});

function mkEvent({uid,start,dur,trial,mode,place,n=1}){
  const x=thread(uid).m;
  const skill=x.learn||x.teach;
  const r=k=>Math.random().toString(36).slice(2,2+k);
  const lead=Math.max(30e3,Math.min(15*MIN,(start-Date.now())/3));
  return {id:'e'+Date.now()+r(3),uid,skill,learn:x.learn,teach:x.teach,pay:PAY[x.type],start,dur,trial,mode,place,code:`${r(3)}-${r(4)}-${r(3)}`,n,
    title:`${skill}${trial?'试听课':`课 · 第 ${n} 节`}`,status:'upcoming',created:Date.now(),remindAt:start-lead,reminded:false};

  const card=ev=>{ const u=userById(ev.uid); const s=statusOf(ev);
    return `<div class="ev"><div class="tm"><b>${fmtHM(ev.start)}</b><small>${fmtDay(ev.start)}</small><br><small>${ev.dur} 分钟</small></div>
      <div style="min-width:0"><div class="ti">${avatarHTML(u,24)} ${esc(ev.title)} · ${esc(u.name)} ${stHTML(ev)}</div>
      <div class="meta"><span>${ev.mode==='线上'?`🔗 <a href="${esc(roomURL(ev))}">${esc(roomURL(ev))}</a>`:'📍 '+esc(ev.place)}</span><span>${esc(payText(ev))}${ev.trial?' · 首课试听免费':''}</span><span class="sync">✓ 已同步到你和 ${esc(u.name)} 的日程 · 开课前小换会提醒</span>${ev.rating?`<span>你的评价：${'⭐'.repeat(ev.rating)}</span>`:''}</div>
      <div class="acts">${s!=='done'?`<button class="btn pri" data-act="join" data-eid="${ev.id}">${ev.mode==='线上'?'进入课堂':'到达签到'}</button><button class="btn" data-act="ics" data-eid="${ev.id}">加入手机日历</button>`:''}<button class="btn" data-act="thread" data-tid="${ev.uid}">💬 和 ${esc(u.name)} 聊天</button></div></div></div>`; };
  $('#main').innerHTML=`<div class="page"><div class="page-in">
    <h1>日程</h1><div class="sub">小换帮你约好的课都在这里，双方日程自动同步</div>
    <div class="days"><button class="day${!sel?' on':''}" data-act="calday" data-d="" style="width:64px"><small>全部</small><b>${evs.length}</b></button>${days.map((d,i)=>{ const has=evs.some(e=>inDay(e,d)); return `<button class="day${i===0?' today':''}${sel===d.getTime()?' on':''}" data-act="calday" data-d="${d.getTime()}"><small>${i===0?'今天':'周'+WEEK[d.getDay()]}</small><b>${d.getDate()}</b>${has?'<i></i>':''}</button>`; }).join('')}</div>
    ${!evs.length?'<div class="empty"><b>📅</b>还没有课程安排<br><span style="font-size:13px">和小换聊聊，找到伙伴、聊好时间后，小换会把课程同步到这里</span><div style="margin-top:14px"><button class="btn pri" data-act="thread" data-tid="agent">去找小换</button></div></div>':''}
    ${up.length?`<div class="sech">待上课 · ${up.length}</div>${up.map(card).join('')}`:''}
    ${done.length?`<div class="sech">已完成 · ${done.length}</div>${done.map(card).join('')}`:''}
    ${evs.length&&!shown.length?'<div class="empty"><b>🌤</b>这天没有课程</div>':''}
  </div></div>`;
}

/* ---- 我的 ---- */
function renderMe(){
  const P=state.profile;
  if(!P){ $('#main').innerHTML='<div class="page"><div class="page-in"><h1>我的</h1><div class="sub">技能档案</div><div class="empty"><b>🪪</b>还没有技能档案<br><span style="font-size:13px">和小换聊 1 分钟就能生成</span><div style="margin-top:14px"><button class="btn pri" data-act="thread" data-tid="agent">去和小换聊聊</button></div></div></div></div>'; return; }
  const done=state.events.filter(e=>e.status==='done');
  const hrs=Math.round(done.reduce((a,e)=>a+e.dur,0)/60*10)/10;
  $('#main').innerHTML=`<div class="page"><div class="page-in">
    <h1>我的</h1><div class="sub">技能档案由小换根据你们的对话生成</div>
    <div class="grid2">
      <div class="card">
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${avatarHTML({id:'me',name:P.name},60)}<div><div style="font-size:20px;font-weight:700">${esc(P.name)}</div><div class="kv">${esc(P.city)} · ${done.length?`已上 ${done.length} 节课`:'新加入'}</div></div></div>
        ${P.exp?`<div class="kv">“${esc(P.exp)}”</div>`:''}
        <div class="kv" style="margin-top:12px">📤 我能教</div><div class="tags">${P.teach.map(t=>tagHTML(t.skill,'teach',t.level)).join('')}</div>
        <div class="kv">📥 我想学</div><div class="tags">${P.learn.map(l=>tagHTML(l.skill,'learn',l.level)).join('')}</div>
        ${P.goal?`<div class="kv">🎯 ${esc(P.goal)}</div>`:''}
        <div class="tags" style="margin-top:12px">${[P.mode==='都可以'?'💻📍 线上 / 线下':P.mode==='线上'?'💻 线上':'📍 线下','⏱ '+P.dur+' / 次','🔁 '+P.freq,...P.avail.map(a=>'📅 '+a)].map(x=>`<span class="a2-badge soft">${esc(x)}</span>`).join('')}</div>
        <button class="btn ai" data-act="edit" style="margin-top:6px">✨ 让小换帮我修改档案</button>
      </div>
      <div class="card">
        <h3>⏱ 时间币</h3>
        <div class="stats"><div class="stat"><b>${state.credits}</b><span>余额</span></div><div class="stat"><b>${done.length}</b><span>已上课程</span></div><div class="stat"><b>${hrs}</b><span>累计小时</span></div></div>
        <div class="rules"><div>· 教别人 1 小时 +1 币，向别人学 1 小时 −1 币</div><div>· 技能互换的课时互相抵扣，不花币</div><div>· 每段新关系首课 15 分钟试听免费</div></div>
        <div class="ledger">${state.ledger.map(l=>`<div><span>${esc(l.t)}</span><span class="${l.d>0?'plus':l.d<0?'minus':'zero'}">${l.d>0?'+':''}${l.d}</span></div>`).join('')}</div>
      </div>
    </div>
    <div style="margin-top:20px;text-align:center"><button class="btn" data-act="logout" style="color:var(--muted)">退出登录</button></div>
  </div></div>`;
}

/* =====================================================================
   事件
   ===================================================================== */
document.addEventListener('click',e=>{
  const b2=e.target.closest('[data-a2btn]'); if(b2){ onA2Button(b2.closest('.a2ui').dataset.sid,b2.dataset.a2btn); return; }
  const chip=e.target.closest('.a2-chip'); if(chip){
    const sid=chip.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; if(!s||s.locked) return;
    const cid=chip.closest('[data-a2mc]').dataset.a2mc, p=s.components[cid].MultipleChoice, v=chip.dataset.v;
    let sel=(getPath(s.data,p.selections.path)||[]).slice();
    if(p.maxAllowedSelections===1) sel=[v]; else if(sel.includes(v)) sel=sel.filter(x=>x!==v); else { if(sel.length>=p.maxAllowedSelections){ toast(`最多选 ${p.maxAllowedSelections} 个`); return; } sel.push(v); }
    setPath(s.data,p.selections.path,sel); save();
    chip.parentElement.querySelectorAll('.a2-chip').forEach(c=>c.classList.toggle('on',sel.includes(c.dataset.v)));
    return;
  }
  const star=e.target.closest('[data-a2rate] button'); if(star){
    const sid=star.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; if(!s||s.locked) return;
    const p=s.components[star.parentElement.dataset.a2rate].Rating, n=+star.dataset.n;
    setPath(s.data,p.value.path,n); save();
    star.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.n<=n));
    return;
  }
  const a=e.target.closest('[data-act]');
  if(!a){ const link=e.target.closest('a[href*="#room="]'); if(link){ e.preventDefault(); openRoomByHash(link.getAttribute('href')); } return; }
  const act=a.dataset.act;
  if(act==='go') go(a.dataset.view);
  else if(act==='thread') go('chat',a.dataset.tid);
  else if(act==='send') send();
  else if(act==='sug') send(a.textContent);
  else if(act==='book'){ if(thread(a.dataset.uid)) BOOK.card(a.dataset.uid,true); }
  else if(act==='join') joinClass(a.dataset.eid);
  else if(act==='ics') downloadICS(a.dataset.eid);
  else if(act==='calday'){ state.calDay=a.dataset.d?+a.dataset.d:null; renderCal(); }
  else if(act==='back'){ state.mlist=true; renderAll(); }
  else if(act==='bclose') $('#banner').classList.remove('show');
  else if(act==='edit'){ go('chat','agent'); say('agent','好的，我们重新过一遍，之前填的我都帮你保留了 ✍️',{ms:500}); AGENT.askTeach(); }
  else if(act==='logout'){ if(confirm('确定退出登录吗？本设备上的对话和日程将被清除。')){ try{localStorage.removeItem(KEY);}catch(_){} location.reload(); } }
  else if(act==='mic'){ ROOM.mic=!ROOM.mic; a.classList.toggle('off',!ROOM.mic); a.textContent=ROOM.mic?'🎤 静音':'🔇 已静音'; }
  else if(act==='cam'){ ROOM.cam=!ROOM.cam; a.classList.toggle('off',!ROOM.cam); a.textContent=ROOM.cam?'📷 关摄像头':'📷 已关闭'; const t=$('#mytile'); if(t) t.classList.toggle('off',!ROOM.cam); }
  else if(act==='share') toast('屏幕共享已开启');
  else if(act==='endClass') endClass();
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('[data-a2bind]'); if(inp){ const s=state.surfaces[inp.closest('.a2ui').dataset.sid]; if(s&&!s.locked){ setPath(s.data,inp.dataset.a2bind,inp.value); save(); } return; }
  if(e.target.id==='input'){ const t=e.target; t.style.height='auto'; t.style.height=Math.min(140,t.scrollHeight)+'px'; }
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='input' && e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); send(); }
  else if(e.target.classList && e.target.classList.contains('a2-input') && e.key==='Enter' && !e.isComposing && e.keyCode!==229){ const btn=e.target.closest('.a2ui').querySelector('.a2-btn.pri'); if(btn) btn.click(); }
});
function openRoomByHash(h){ const code=(String(h).split('#room=')[1]||'').trim(); const ev=state.events.find(e=>e.code===code); if(ev) joinClass(ev.id); else toast('课堂链接已失效或不属于当前账号'); }
window.addEventListener('hashchange',()=>{ if(location.hash.startsWith('#room=')){ const h=location.hash; history.replaceState(null,'',location.pathname+location.search); openRoomByHash(h); } });
window.addEventListener('resize',()=>{ $('#app').classList.toggle('mlist', state.view==='chat'&&state.mlist); });

/* =====================================================================
   启动
   ===================================================================== */
if(/[?&]a2ui\b/.test(location.search)) $('#insp').classList.add('show');
window.A2UI = {log:A2UI_LOG, surfaces:()=>state.surfaces};
state.mlist=false; state.view='chat';
renderAll();
if(!state.started) AGENT.start(); else AGENT.resume();
if(location.hash.startsWith('#room=')){ const h=location.hash; history.replaceState(null,'',location.pathname+location.search); setTimeout(()=>openRoomByHash(h),300); }
setInterval(tick,2000); tick();
</script>
</body>
</html>
