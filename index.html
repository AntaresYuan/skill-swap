  const ws=weekStart(UIS.weekOff), we=ws+7*DAY, d0=new Date(ws), d1=new Date(we-DAY);
  const wl=`${d0.getMonth()+1}月${d0.getDate()}日 – ${d1.getMonth()!==d0.getMonth()?(d1.getMonth()+1)+'月':''}${d1.getDate()}日`;
  const tools=`<div class="tools">${UIS.calView==='week'?`<button class="ibtn" data-act="wk" data-d="-1" aria-label="上一周">${I('chevl')}</button><button class="btn" data-act="wk" data-d="0">今天</button><button class="ibtn" data-act="wk" data-d="1" aria-label="下一周">${I('chevr')}</button><span class="wl">${wl}</span>`:''}<div class="segc"><button class="${UIS.calView==='week'?'on':''}" data-act="calview" data-v="week">周</button><button class="${UIS.calView==='list'?'on':''}" data-act="calview" data-v="list">列表</button></div></div>`;
  let body='';
  if(UIS.calView==='week'){
    const inWeek=evs.filter(e=>e.start>=ws&&e.start<we);
    let h0=WK.h0,h1=WK.h1; inWeek.forEach(e=>{ const h=new Date(e.start).getHours(); h0=Math.min(h0,h); h1=Math.max(h1,Math.ceil((e.start+e.dur*MIN-dayStart(e.start))/HOUR)); }); WK.h0=h0;
    const days=[...Array(7)].map((_,i)=>ws+i*DAY), today=dayStart(Date.now());
    const hours=[...Array(h1-h0)].map((_,i)=>h0+i);
    body=`<div class="wk"><div class="wk-head"><div></div>${days.map(d=>{ const dt=new Date(d); return `<div class="wd${d===today?' today':''}"><small>周${WEEK[dt.getDay()]}</small><b>${dt.getDate()}</b></div>`; }).join('')}</div>
      <div class="wk-body" id="wkBody"><div class="wk-grid" style="height:${(h1-h0)*WK.hh}px"><div class="gut">${hours.map(h=>h===h0?'':`<span style="top:${(h-h0)*WK.hh}px">${pad(h)}:00</span>`).join('')}</div>
      ${days.map(d=>{ const list=inWeek.filter(e=>dayStart(e.start)===d); const nd=new Date();
        return `<div class="col${d===today?' today':d<today?' past':''}">${list.map(e=>{ const u=userById(e.uid), dt=new Date(e.start), top=(dt.getHours()-h0)*WK.hh+dt.getMinutes()*WK.hh/60, ht=Math.max(e.dur*WK.hh/60,24);
          return `<button class="evb${e.status==='done'?' done':''}${ht<44?' short':''}" style="top:${top}px;height:${ht}px;--h:${hueOf(u.id)}" data-act="evsheet" data-eid="${e.id}"><b>${esc(e.title)}</b><span>${fmtHM(e.start)} · ${esc(u.name)}</span></button>`; }).join('')}${d===today?`<div class="nowl" style="top:${(nd.getHours()-h0)*WK.hh+nd.getMinutes()*WK.hh/60}px"></div>`:''}</div>`; }).join('')}
      </div></div></div>`;
  } else {
    const up=evs.filter(e=>e.status!=='done'), done=evs.filter(e=>e.status==='done').reverse();
    const card=ev=>{ const s=statusOf(ev); return `<div class="ev" data-act="evsheet" data-eid="${ev.id}">${ticketHTML(ev)}<div class="acts">${s!=='done'?`<button class="btn pri" data-act="join" data-eid="${ev.id}">${I(ev.mode==='线上'?'video':'pin')}${ev.mode==='线上'?'进入课堂':'签到'}</button>`:''}<button class="btn" data-act="thread" data-tid="${ev.uid}">${I('chat')}发消息</button></div></div>`; };
    body=!evs.length?`<div class="empty"><div class="ei">${I('calendar')}</div><h3>还没有课程安排</h3>和小换聊聊，找到伙伴、聊好时间后，课程会自动出现在这里<div style="margin-top:16px"><button class="btn pri" data-act="thread" data-tid="agent">${I('sparkle')}去找小换</button></div></div>`
      :`${up.length?`<div class="sech">待上课 · ${up.length}</div>${up.map(card).join('')}`:''}${done.length?`<div class="sech">已完成 · ${done.length}</div>${done.map(card).join('')}`:''}`;
  }
  $('#main').innerHTML=`${pageTop('日程')}<div class="page"><div class="page-in"><div class="ph"><div><h1>日程</h1><div class="sub">小换帮你约好的课都在这里，双方日程自动同步</div></div>${tools}</div>${body}</div></div>`;
  const wb=$('#wkBody'); if(wb){ const nd=new Date(); const first=state.events.filter(e=>e.start>=ws&&e.start<we).map(e=>new Date(e.start).getHours()); const target=Math.min(nd.getHours(),...(first.length?first:[nd.getHours()]))-1; wb.scrollTop=Math.max(0,(target-WK.h0)*WK.hh); }
}

/* ---- 我的 ---- */
function renderMe(){
  const P=state.profile;
  if(!P){ $('#main').innerHTML=`${pageTop('我的档案')}<div class="page"><div class="page-in"><div class="ph"><div><h1>我的档案</h1><div class="sub">技能档案由小换根据对话生成</div></div></div><div class="empty"><div class="ei">${I('user')}</div><h3>还没有技能档案</h3>和小换聊 1 分钟就能生成<div style="margin-top:16px"><button class="btn pri" data-act="thread" data-tid="agent">${I('sparkle')}去和小换聊聊</button></div></div></div></div>`; return; }
  const done=state.events.filter(e=>e.status==='done'); const hrs=Math.round(done.reduce((a,e)=>a+e.dur,0)/60*10)/10;
  $('#main').innerHTML=`${pageTop('我的档案')}<div class="page"><div class="page-in" style="max-width:920px">
    <div class="ph"><div><h1>我的档案</h1><div class="sub">技能档案由小换根据对话生成，随时可以让小换帮你更新</div></div></div>
    <div class="grid2">
      <div class="card"><div class="pcard-cover" style="background:${coverOf('me'+P.name)};height:88px"></div>
        <div class="pad" style="padding-top:0">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:-32px;position:relative;z-index:1"><span style="display:inline-flex;border-radius:50%;border:3px solid var(--panel);box-shadow:var(--shadow-sm)">${avatarHTML({id:'me',name:P.name},64)}</span><button class="btn" data-act="edit">${I('sparkle')}让小换更新档案</button></div>
          <div style="font-size:19px;font-weight:650;margin-top:10px">${esc(P.name)}</div>
          <div style="font-size:13px;color:var(--muted)">${esc(P.city)} · ${done.length?`已上 ${done.length} 节课`:'新加入'}</div>
          ${P.exp?`<div style="font-size:13.5px;color:var(--text2);margin-top:10px">“${esc(P.exp)}”</div>`:''}
          <div class="kv">能教</div><div class="tags">${P.teach.map(t=>tagHTML(t.skill,'teach',t.level)).join('')}</div>
          <div class="kv">想学</div><div class="tags">${P.learn.map(l=>tagHTML(l.skill,'learn',l.level)).join('')}</div>
          ${P.goal?`<div class="kv">目标</div><div style="font-size:14px">${esc(P.goal)}</div>`:''}
          <div class="kv">偏好</div><div class="tags">${[[P.mode==='都可以'?'线上 / 线下':P.mode,'video'],[P.dur+' / 次','clock'],[P.freq,'repeat'],...P.avail.map(a=>[a,'calendar'])].map(([x,ic])=>`<span class="badge">${I(ic)}${esc(x)}</span>`).join('')}</div>
        </div></div>
      <div class="card"><div class="pad">
        <div class="wallet"><small>时间币余额</small><b>${state.credits}</b><div class="row"><span>已上课程 ${done.length}</span><span>累计 ${hrs} 小时</span></div></div>
        <div class="rules"><div>教别人 1 小时 +1 币，向别人学 1 小时 −1 币</div><div>技能互换的课时互相抵扣，不花币</div><div>每段新关系首课 15 分钟试听免费</div></div>
        <div class="ledger">${state.ledger.map(l=>`<div><span class="li">${I(l.i||'coins')}</span><span class="lt">${esc(l.t)}<small>${fmtWhen(l.at)}</small></span><span class="${l.d>0?'plus':l.d<0?'minus':'zero'}">${l.d>0?'+':''}${l.d}</span></div>`).join('')}</div>
      </div></div>
    </div></div></div>`;
}

/* =====================================================================
   事件
   ===================================================================== */
document.addEventListener('click',e=>{
  if(UIS.menu&&!e.target.closest('#pop')&&!e.target.closest('[data-act=menu]')){ UIS.menu=false; $('#pop')?.classList.remove('show'); }
  const b2=e.target.closest('[data-a2btn]'); if(b2){ onA2Button(b2.closest('.a2ui').dataset.sid,b2.dataset.a2btn); return; }
  const opt=e.target.closest('[data-a2mc] [data-v]'); if(opt){
    const sid=opt.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; if(!s||s.locked) return;
    const cid=opt.closest('[data-a2mc]').dataset.a2mc, p=Object.values(s.components[cid])[0], v=opt.dataset.v;
    let sel=(getPath(s.data,p.selections.path)||[]).slice();
    if(p.maxAllowedSelections===1) sel=[v]; else if(sel.includes(v)) sel=sel.filter(x=>x!==v); else { if(sel.length>=p.maxAllowedSelections){ toast(`最多选 ${p.maxAllowedSelections} 个`,{icon:'info',tone:'warn'}); return; } sel.push(v); }
    setPath(s.data,p.selections.path,sel); save();
    if(Object.values(s.components).some(c=>Object.values(c)[0].visibleIf)) refreshSurface(sid);
    else opt.parentElement.querySelectorAll('[data-v]').forEach(c=>{ c.classList.toggle('on',sel.includes(c.dataset.v)); c.setAttribute('aria-pressed',sel.includes(c.dataset.v)); });
    return;
  }
  const star=e.target.closest('[data-a2rate] .stars button'); if(star){
    const wrap=star.closest('[data-a2rate]'), sid=star.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; if(!s||s.locked) return;
    const p=s.components[wrap.dataset.a2rate].Rating, n=+star.dataset.n;
    setPath(s.data,p.value.path,n); save();
    wrap.querySelectorAll('.stars button').forEach(b=>b.classList.toggle('on',+b.dataset.n<=n)); wrap.querySelector('.rl').textContent=RATING_LABEL[n];
    return;
  }
  const link=e.target.closest('a[href*="#room="]'); if(link){ e.preventDefault(); openRoomByHash(link.getAttribute('href')); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  switch(act){
    case 'go': go(a.dataset.view); break;
    case 'thread': closeSheet(); go('chat',a.dataset.tid); break;
    case 'partner': openPartner(a.dataset.uid); break;
    case 'profile': profileSheet(a.dataset.uid); break;
    case 'send': send(); break;
    case 'sug': send(a.textContent); break;
    case 'book': if(thread(a.dataset.uid)) BOOK.card(a.dataset.uid,true); break;
    case 'join': joinClass(a.dataset.eid); break;
    case 'ics': downloadICS(a.dataset.eid); break;
    case 'copylink': { e.stopPropagation(); const ev=state.events.find(x=>x.id===a.dataset.eid); if(ev) copyText(roomURL(ev),'课堂链接已复制'); break; }
    case 'evsheet': if(!e.target.closest('.btn')) eventSheet(a.dataset.eid); break;
    case 'calview': UIS.calView=a.dataset.v; renderCal(); break;
    case 'wk': UIS.weekOff=+a.dataset.d===0?0:UIS.weekOff+(+a.dataset.d); renderCal(); break;
    case 'openDrawer': UIS.drawer=true; $('#app').classList.add('drawer'); break;
    case 'closeDrawer': UIS.drawer=false; $('#app').classList.remove('drawer'); break;
    case 'closeSheet': closeSheet(); break;
    case 'nclose': $('#notif').classList.remove('show'); break;
    case 'jump': { const el=$('#msgs'); el.scrollTo({top:el.scrollHeight,behavior:RM?'auto':'smooth'}); UIS.stick=true; a.classList.remove('show'); break; }
    case 'car': { const lst=a.parentElement.querySelector('.a2-list.h'); lst.scrollBy({left:(+a.dataset.d)*310,behavior:RM?'auto':'smooth'}); break; }
    case 'a2open': { const sid=a.closest('.a2ui').dataset.sid, s=state.surfaces[sid]; s.open=!s.open; save(); refreshSurface(sid); break; }
    case 'copy': { const m=thread('agent').msgs.find(x=>x.id===+a.dataset.mid); if(m) copyText(m.text.replace(/\*\*/g,''),'已复制到剪贴板'); break; }
    case 'fb': { const m=thread('agent').msgs.find(x=>x.id===+a.dataset.mid); if(!m) break; m.fb=m.fb===a.dataset.v?null:a.dataset.v; save(); const row=a.parentElement; row.querySelectorAll('[data-act=fb]').forEach(b=>b.classList.toggle('on',b.dataset.v===m.fb)); row.classList.toggle('has',!!m.fb); if(m.fb) toast(m.fb==='up'?'感谢反馈，小换会继续保持':'感谢反馈，小换会持续改进',{icon:m.fb==='up'?'tup':'tdown',tone:'info'}); break; }
    case 'attach': toast('当前对话暂不支持发送附件',{icon:'info',tone:'info'}); break;
    case 'voice': voiceInput(a); break;
    case 'cmdk': UIS.menu=false; $('#pop')?.classList.remove('show'); UIS.drawer=false; $('#app').classList.remove('drawer'); openCmdk(); break;
    case 'menu': UIS.menu=!UIS.menu; $('#pop').classList.toggle('show',UIS.menu); break;
    case 'theme': UIS.menu=false; setTheme(a.dataset.t); break;
    case 'edit': startEdit(); break;
    case 'logout': UIS.menu=false; $('#pop')?.classList.remove('show'); openDialog(`<h3>退出登录？</h3><p>本设备上的对话、日程和档案将被清除。</p><div class="da"><button class="btn" data-act="dclose">取消</button><button class="btn danger" data-act="logoutGo">退出登录</button></div>`); break;
    case 'logoutGo': try{ localStorage.removeItem(KEY); }catch(_){} location.reload(); break;
    case 'dclose': closeDialog(); break;
    case 'mic': ROOM.mic=!ROOM.mic; a.classList.toggle('off',!ROOM.mic); a.innerHTML=I(ROOM.mic?'mic':'micoff'); a.dataset.tip=ROOM.mic?'静音':'取消静音'; { const n=$('#mynm'); if(n) n.innerHTML=I(ROOM.mic?'mic':'micoff')+'我'; } break;
    case 'cam': toggleCam(a); break;
    case 'share': a.classList.toggle('off'); toast(a.classList.contains('off')?'屏幕共享已开启':'屏幕共享已停止',{icon:'screen',tone:'info'}); break;
    case 'endAsk': askEnd(); break;
    case 'endClass': endClass(); break;
  }
});
document.addEventListener('submit',e=>{ if(e.target.matches('[data-act=noteform]')){ e.preventDefault(); const inp=$('#noteIn'), v=inp.value.trim(); if(!v) return; inp.value=''; ROOM.notes.push({t:v,ai:false,at:Date.now()}); const box=$('#rnotes'); box.insertAdjacentHTML('beforeend',`<div class="note mine"><b>我</b><div><small>${fmtHM(Date.now())}</small>${esc(v)}</div></div>`); box.scrollTop=box.scrollHeight; } });
document.addEventListener('mouseover',e=>{ const b=e.target.closest('[data-a2rate] .stars button'); if(!b||b.closest('.a2ui.locked')) return; const wrap=b.closest('[data-a2rate]'), n=+b.dataset.n; const st=wrap.querySelector('.stars'); st.classList.add('pv'); st.querySelectorAll('button').forEach(x=>x.classList.toggle('pv',+x.dataset.n<=n)); wrap.querySelector('.rl').textContent=RATING_LABEL[n]; });
document.addEventListener('mouseout',e=>{ const st=e.target.closest('[data-a2rate] .stars'); if(!st||st.contains(e.relatedTarget)) return; st.classList.remove('pv'); const wrap=st.closest('[data-a2rate]'); const n=st.querySelectorAll('button.on').length; wrap.querySelector('.rl').textContent=RATING_LABEL[n]||''; });
document.addEventListener('input',e=>{
  const inp=e.target.closest('[data-a2bind]'); if(inp){ const root=inp.closest('.a2ui'), s=state.surfaces[root.dataset.sid]; if(s&&!s.locked){ setPath(s.data,inp.dataset.a2bind,inp.value); save(); root.querySelectorAll(`[data-bindtext="${inp.dataset.a2bind}"]`).forEach(x=>x.textContent=inp.value); } return; }
  if(e.target.id==='input'){ const t=e.target; t.style.height='auto'; t.style.height=Math.min(160,t.scrollHeight)+'px'; const b=$('#sendBtn'); if(b) b.disabled=!t.value.trim(); }
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); CMDK.open?closeCmdk():openCmdk(); return; }
  if(e.key==='Escape'){ if(CMDK.open) return closeCmdk(); if($('#dialog').classList.contains('show')) return closeDialog(); if($('#sheet').classList.contains('show')) return closeSheet(); if(UIS.menu){ UIS.menu=false; $('#pop')?.classList.remove('show'); return; } UIS.drawer=false; $('#app').classList.remove('drawer'); return; }
  if(e.target.id==='input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); send(); return; }
  if(e.target.classList&&e.target.classList.contains('a2-input')&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){ const btn=e.target.closest('.a2ui').querySelector('.a2-btn.pri'); if(btn) btn.click(); return; }
  if(state.view==='cal'&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&!CMDK.open){ if(e.key==='t'){ UIS.weekOff=0; renderCal(); } else if(e.key==='ArrowLeft'&&UIS.calView==='week'){ UIS.weekOff--; renderCal(); } else if(e.key==='ArrowRight'&&UIS.calView==='week'){ UIS.weekOff++; renderCal(); } }
});
let REC=null;
function voiceInput(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('当前浏览器不支持语音输入，建议使用 Chrome',{icon:'info',tone:'warn'}); return; }
  if(REC){ REC.stop(); return; }
  REC=new SR(); REC.lang='zh-CN'; REC.interimResults=true; btn.classList.add('rec'); toast('正在聆听，说完会自动填入输入框',{icon:'mic',tone:'info'});
  REC.onresult=ev=>{ const t=[...ev.results].map(r=>r[0].transcript).join(''); const inp=$('#input'); if(inp){ inp.value=t; inp.dispatchEvent(new Event('input',{bubbles:true})); } };
  REC.onerror=()=>toast('没有听清，请再试一次',{icon:'info',tone:'warn'});
  REC.onend=()=>{ btn.classList.remove('rec'); REC=null; };
  REC.start();
}
function openRoomByHash(h){ const code=(String(h).split('#room=')[1]||'').trim(); const ev=state.events.find(e=>e.code===code); if(ev) joinClass(ev.id); else toast('课堂链接已失效或不属于当前账号',{icon:'info',tone:'warn'}); }
window.addEventListener('hashchange',()=>{ if(location.hash.startsWith('#room=')){ const h=location.hash; history.replaceState(null,'',location.pathname+location.search); openRoomByHash(h); } });
window.addEventListener('resize',()=>layoutToasts());

/* =====================================================================
   启动
   ===================================================================== */
if(/[?&]a2ui\b/.test(location.search)) $('#insp').classList.add('show');
window.A2UI={log:A2UI_LOG,surfaces:()=>state.surfaces};
state.view='chat';
renderAll();
if(!state.started) AGENT.start(); else AGENT.resume();
if(location.hash.startsWith('#room=')){ const h=location.hash; history.replaceState(null,'',location.pathname+location.search); setTimeout(()=>openRoomByHash(h),300); }
setInterval(tick,1000); tick();
</script>
